<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RP10 · The Rize of Power 3D</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden;
    font-family: 'VT323', monospace; color:#e8c878; }
  #stage { position:fixed; inset:0; display:block; }
  #hud { position:fixed; top:6px; left:6px; z-index:10;
    background:rgba(5,3,16,.82); border:1px solid rgba(232,200,120,.35);
    padding:6px 10px; font-size:14px; letter-spacing:.1em; }
  #load-status { position:fixed; top:6px; right:6px; z-index:10;
    background:rgba(5,3,16,.82); border:1px solid rgba(232,200,120,.35);
    padding:4px 8px; font-size:11px; color:#8080a0; }
  #controls { position:fixed; bottom:8px; left:8px; z-index:10;
    background:rgba(5,3,16,.82); border:1px solid rgba(232,200,120,.35);
    padding:4px 8px; font-size:12px; color:#b8aec8; letter-spacing:.12em; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">RP10 · Malezor Resident<br/>3D · Blender-authored assets</div>
<div id="load-status">Booting Three.js…</div>
<noscript><div style="color:#f88;padding:20px">JavaScript disabled — RP10 requires JS + WebGL.</div></noscript>
<div id="controls">WASD move · Space jump · Mouse orbit · Shift run</div>

<script type="importmap">
{
  "imports": {
    "three":            "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ============================================================================
 * RP10 · 3D RIZE OF POWER · SCAFFOLDING v0.1
 * ----------------------------------------------------------------------------
 * Blender + Hyper3D-generated GLBs load from assets/rp10/models/*.glb.
 * Three.js runtime with GLTFLoader, orbit-tilt camera, WASD character
 * controller (capsule + ground raycast), directional sun + ambient fill.
 *
 * Blender MCP pipeline (per session):
 *   1. Launch Blender · enable the MCP addon panel · connect
 *   2. From Claude: generate_hyper3d_model_via_text('...') → import → export GLB
 *   3. Drop GLB into assets/rp10/models/  → assetBook picks it up on reload
 *
 * PIPELINE STATUS
 *   ✓ scene · lights · sky · ground plane
 *   ✓ WASD character controller · capsule collider · raycast ground
 *   ✓ GLB loader wired · pulls from assets/rp10/models/*.glb
 *   ✓ Debug camera orbit (mouse drag) · perspective + fallback ortho tilt
 *   ✗ Blender GLB assets (waiting for first hyper3d generation)
 *   ✗ Terrain heightmap · districts · portals · combat
 * ========================================================================== */

// ── Constants ────────────────────────────────────────────────────────
const ASSETS = 'assets/rp10';
const MODELS = `${ASSETS}/models`;

// ── Renderer + scene ─────────────────────────────────────────────────
const canvas = document.getElementById('stage');
const status = document.getElementById('load-status');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);   // sky blue placeholder
scene.fog = new THREE.Fog(0x87ceeb, 40, 120);

// ★ Third-person perspective camera · trails behind the player
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 500);
// Camera state · rotates around player based on right-stick / mouse
// ★ RP9 · proven third-person camera math · ported verbatim, retuned
// for chibi scale (1.7m character instead of RP9's 4m Zyrex).
// yaw = π puts camera BEHIND character facing +Z.  pitch controls
// downward tilt.  Camera position formula uses sin/cos directly so
// there's no ambiguity about direction.
const camRig = {
  yaw:      Math.PI,   // camera starts BEHIND player facing forward
  pitch:    0.36,      // ~21° down tilt · Wind-Waker feel
  distance: 5,         // meters back from player
  baseY:    2.0,       // camera baseline height above player root
  aimY:     1.4,       // aim slightly above character head (chibi 1.7m)
};
// ★ Seed initial camera at RP9-style trailing position (no lerp overshoot)
{
  const horizontal = Math.cos(camRig.pitch) * camRig.distance;
  camera.position.set(
    0 + Math.sin(camRig.yaw) * horizontal,
    0 + camRig.baseY + Math.sin(camRig.pitch) * camRig.distance,
    0 + Math.cos(camRig.yaw) * horizontal
  );
  camera.lookAt(0, camRig.aimY, 0);
}

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});

// ── Lights ───────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.1);
sun.position.set(15, 25, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 80;
scene.add(sun);

// ── Ground plane (placeholder · replaced by terrain in Phase 1) ─────
const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a8a56, roughness: 0.9 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid overlay so we can see tile bounds during dev
const grid = new THREE.GridHelper(60, 60, 0x203020, 0x203020);
grid.position.y = 0.01;
scene.add(grid);
// ★ DEBUG · axis helper at world origin so we can see where (0,0,0) is
// (red=X, green=Y, blue=Z) · character should stand on this.
scene.add(new THREE.AxesHelper(3));

// ── GLB loader + asset book ──────────────────────────────────────────
const gltfLoader = new GLTFLoader();
const assetBook = {};   // { slug: THREE.Group }

function loadGlb(slug, path, position = [0, 0, 0], scale = 1) {
  return new Promise((resolve) => {
    gltfLoader.load(
      path,
      (gltf) => {
        const g = gltf.scene;
        g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        g.position.set(...position);
        g.scale.setScalar(scale);
        scene.add(g);
        assetBook[slug] = g;
        console.log(`[rp10] loaded ${slug} from ${path}`);
        resolve(g);
      },
      undefined,
      (err) => {
        console.warn(`[rp10] ${slug} MISSING at ${path} · placeholder shown`);
        // Placeholder cube so the scene isn't empty while assets bake
        const cube = new THREE.Mesh(
          new THREE.BoxGeometry(2, 3, 2),
          new THREE.MeshStandardMaterial({ color: 0x8a5a30, wireframe: false })
        );
        cube.position.set(...position);
        cube.castShadow = true;
        scene.add(cube);
        assetBook[slug] = cube;
        resolve(cube);
      }
    );
  });
}

// ── Player · Mixamo-rigged FBX with Idle animation ─────────────────
// Idle.fbx (from Mixamo auto-rig) includes both the skinned chibi mesh
// AND the idle animation clip.  We load the FBX as the character mesh
// and drive its embedded animation via AnimationMixer.  Future clips
// (walk / run / attack) go into the same clips array.
const player = new THREE.Group();
player.position.set(0, 0, 0);
scene.add(player);

let playerMixer = null;
let playerCharacter = null;    // ref to the loaded GLB scene root
let playerHipsBone = null;     // Mixamo mixamorigHips bone · used for camera aim
let playerAimHeight = 1.0;     // Y offset above hips for lookAt target
const playerActions = {};   // { idle, walk, run, attackLight, attackHeavy, jump }
let currentAction = null;   // AnimationAction currently playing

// Cross-fade helper · 0.15s blend between clips
function playAction(name, fadeMs = 150) {
  const next = playerActions[name];
  if (!next || next === currentAction) return;
  next.reset().setEffectiveWeight(1).fadeIn(fadeMs / 1000).play();
  if (currentAction) currentAction.fadeOut(fadeMs / 1000);
  currentAction = next;
}

// Visible RED CAPSULE placeholder · replaced when Idle.fbx streams in.
// So we always know the player exists in the scene even if the FBX fails.
const _placeholder = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.4, 1.0, 4, 8),
  new THREE.MeshStandardMaterial({ color: 0xd83030 })
);
_placeholder.position.y = 0.9;
_placeholder.castShadow = true;
player.add(_placeholder);

// Load rigged mesh + Idle animation as GLB (baked from Mixamo FBX via
// Blender · Three.js GLTFLoader handles skinned meshes + animations
// natively · no FBXLoader flakiness).  Extra clips attach after.
new GLTFLoader().load(`${MODELS}/animations/idle.glb`, (gltf) => {
  // Loaded · drop the red placeholder
  player.remove(_placeholder);
  _placeholder.geometry.dispose();
  _placeholder.material.dispose();

  const model = gltf.scene;
  // ★ CRITICAL for skinned meshes · geometry.boundingBox is often null after
  // GLTF load · Box3.setFromObject then returns garbage → scale explodes.
  // Force-compute per-geometry bounding boxes BEFORE any bbox math.
  model.traverse(o => {
    if (o.isMesh || o.isSkinnedMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      o.frustumCulled = false;   // skinned meshes shouldn't cull based on stale bbox
      if (o.geometry) {
        o.geometry.computeBoundingBox();
        o.geometry.computeBoundingSphere();
      }
    }
  });
  model.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  console.log(`[rp10] raw model bbox · size=(${size.x.toFixed(3)}, ${size.y.toFixed(3)}, ${size.z.toFixed(3)}) center=(${center.x.toFixed(3)}, ${center.y.toFixed(3)}, ${center.z.toFixed(3)})`);
  // ★ Dump scene tree so we can see any nested transforms baked into the GLB.
  model.traverse(o => {
    if (o !== model && (o.position.lengthSq() > 0.001 || Math.abs(o.rotation.x) + Math.abs(o.rotation.y) + Math.abs(o.rotation.z) > 0.01)) {
      console.log(`  child ${o.name || o.type} · pos=(${o.position.x.toFixed(2)}, ${o.position.y.toFixed(2)}, ${o.position.z.toFixed(2)}) rot=(${o.rotation.x.toFixed(2)}, ${o.rotation.y.toFixed(2)}, ${o.rotation.z.toFixed(2)})`);
    }
  });

  // Guard against zero-size bbox (skinned mesh w/o geometry) · default 1m tall
  const rawH = size.y > 0.001 ? size.y : 1.0;
  const TARGET_H = 1.7;
  const scale = TARGET_H / rawH;
  model.scale.setScalar(scale);
  model.updateMatrixWorld(true);

  // Re-measure with new scale to find where the mesh actually sits after
  // scaling · we'll compensate in an INNER wrapper so the outer player
  // Group stays at its logical position (feet at world 0, at origin).
  const box2 = new THREE.Box3().setFromObject(model);
  const size2 = new THREE.Vector3(); box2.getSize(size2);
  const center2 = new THREE.Vector3(); box2.getCenter(center2);

  // Simplest possible placement · shift model so feet land at player root.
  model.position.set(-center2.x, -box2.min.y, -center2.z);
  player.add(model);
  playerCharacter = model;

  // ★ Grab the Mixamo HIPS bone · every frame we point the camera at THIS
  // bone's world position (with a Y offset).  Bones follow skinning; bbox
  // does not · so this is the only reliable way to track a skinned
  // character's actual on-screen position.
  model.traverse(o => {
    if (o.isBone && /hips?$/i.test(o.name)) playerHipsBone = o;
  });
  if (playerHipsBone) console.log(`[rp10] tracking bone: ${playerHipsBone.name}`);
  else                console.warn('[rp10] no hips bone found · camera falls back to player.position');

  playerAimHeight = 0.6;   // aim ~60 cm above the hips = head-ish height
  console.log(`[rp10] scaled · scale=${scale.toFixed(4)} · size=(${size2.x.toFixed(2)}, ${size2.y.toFixed(2)}, ${size2.z.toFixed(2)}) · model.pos=(${model.position.x.toFixed(2)}, ${model.position.y.toFixed(2)}, ${model.position.z.toFixed(2)})`);

  playerMixer = new THREE.AnimationMixer(model);

  if (gltf.animations && gltf.animations.length) {
    playerActions.idle = playerMixer.clipAction(gltf.animations[0]);
    playAction('idle', 0);
    console.log(`[rp10] idle clip loaded · ${gltf.animations[0].duration.toFixed(2)}s`);
  }

  // ── Attach additional GLB clips onto the same mixer ────────────────
  const extraClips = [
    ['walk', 'walking.glb'],
    // ['run',         'running.glb'],
    // ['attackLight', 'sword_slash.glb'],
    // ['attackHeavy', 'great_sword_slash.glb'],
    // ['jump',        'jumping.glb'],
  ];
  for (const [name, file] of extraClips) {
    new GLTFLoader().load(`${MODELS}/animations/${file}`, (loaded) => {
      if (!loaded.animations || !loaded.animations.length) {
        console.warn(`[rp10] ${file} · no animation clip found`);
        return;
      }
      const clip = loaded.animations[0];
      clip.name = name;
      playerActions[name] = playerMixer.clipAction(clip);
      console.log(`[rp10] ${name} clip loaded · ${clip.duration.toFixed(2)}s`);
    }, undefined, (err) => console.warn(`[rp10] ${file} load failed`, err));
  }

  const s = document.getElementById('load-status');
  if (s) s.textContent = 'Player + idle loaded · walk streaming';
  console.log(`[rp10] player rig loaded · scaled to ${TARGET_H}m (was ${size.y.toFixed(2)}m native)`);
}, undefined, (err) => {
  console.error('[rp10] FAILED to load idle.glb · placeholder stays visible', err);
  const s = document.getElementById('load-status');
  if (s) s.textContent = 'GLB fail · ' + (err && (err.message || err.type || String(err))).slice(0, 60);
});

const playerState = { vy: 0, onGround: true, speed: 5.5, runMult: 1.7 };

// ── Input · keyboard + PS5 DualSense (locked mappings) ─────────────
// ★ CANON per [[aov-controller-priority]] — every AOV build ships with
// working controller from day one.  PS5 button → keyboard key mapping is
// LOCKED to match rp7b so muscle memory transfers between builds:
//   Cross (×)   → 'z'      confirm / interact / jump
//   Circle (○)  → 'shift'  run
//   Square (□)  → 'x'      light attack
//   Triangle (△)→ 'y'      heavy attack
//   R1          → 'r'      cycle mount (later)
//   L1          → 'l'      party menu (later)
//   Options     → 'escape' pause
//   D-Pad + LS  → WASD / arrow-keys (movement)
const keys = new Set();
window.addEventListener('keydown', e => keys.add(e.key.toLowerCase()));
window.addEventListener('keyup',   e => keys.delete(e.key.toLowerCase()));

// PS5 DualSense standard-gamepad-mapping button index → RP-canon key.
const PAD_BTN = {
  0: 'z',       // Cross
  1: 'shift',   // Circle
  2: 'x',       // Square
  3: 'y',       // Triangle
  4: 'l',       // L1
  5: 'r',       // R1
  9: 'escape',  // Options
  12: 'arrowup', 13: 'arrowdown', 14: 'arrowleft', 15: 'arrowright',   // D-Pad
};
const PAD_DEAD = 0.35;   // analog stick deadzone
const pressed = new Set();
let padActive = null;

window.addEventListener('gamepadconnected', (e) => {
  padActive = e.gamepad.index;
  console.log(`[rp10] gamepad · ${e.gamepad.id}`);
  const el = document.getElementById('controls');
  if (el) el.textContent = 'DUALSENSE · ' + e.gamepad.id.split('(')[0].trim() + ' · × confirm · ○ run';
});

function pollGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const pad  = pads[padActive] || pads.find(p => p);
  if (!pad) return;
  // Buttons
  for (const i in PAD_BTN) {
    const key = PAD_BTN[i];
    if (pad.buttons[i] && pad.buttons[i].pressed) {
      if (!pressed.has(key)) {
        pressed.add(key);
        keys.add(key);
        if (key === 'z') keys.add(' ');   // Cross also fires Space (jump)
      }
    } else if (pressed.has(key)) {
      pressed.delete(key);
      keys.delete(key);
      if (key === 'z') keys.delete(' ');
    }
  }
  // Left stick → WASD equivalents
  const lx = pad.axes[0] || 0, ly = pad.axes[1] || 0;
  const setAxis = (key, on) => on ? keys.add(key) : keys.delete(key);
  setAxis('w', ly < -PAD_DEAD);
  setAxis('s', ly >  PAD_DEAD);
  setAxis('a', lx < -PAD_DEAD);
  setAxis('d', lx >  PAD_DEAD);
}

// ── Mouse look (drag with LMB) — RMB and R-stick also drive camera yaw
let dragging = false, lastMx = 0, lastMy = 0;
canvas.addEventListener('mousedown', (e) => { dragging = true; lastMx = e.clientX; lastMy = e.clientY; });
window.addEventListener('mouseup',   () => dragging = false);
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastMx, dy = e.clientY - lastMy;
  // RP9-standard sensitivity + direction
  camRig.yaw   -= dx * 0.006;
  camRig.pitch  = Math.max(0.12, Math.min(0.85, camRig.pitch + dy * 0.004));
  lastMx = e.clientX; lastMy = e.clientY;
});
// Right-stick camera look (added into pollGamepad via pad.axes[2],[3])
let rsX = 0, rsY = 0;
const _origPollGamepad = pollGamepad;
pollGamepad = function() {
  _origPollGamepad();
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const pad = pads[padActive] || pads.find(p => p);
  if (!pad) return;
  const rx = pad.axes[2] || 0, ry = pad.axes[3] || 0;
  rsX = Math.abs(rx) > PAD_DEAD ? rx : 0;
  rsY = Math.abs(ry) > PAD_DEAD ? ry : 0;
};

// ── Third-person character controller · RP9 pattern ────────────────
const _fwd = new THREE.Vector3();
const _rt  = new THREE.Vector3();
const _dir = new THREE.Vector3();
const _desiredCam = new THREE.Vector3();

function updatePlayer(dt) {
  // Right-stick camera look (gamepad)
  if (rsX || rsY) {
    camRig.yaw   -= rsX * 2.2 * dt;
    camRig.pitch  = Math.max(0.12, Math.min(0.85, camRig.pitch + rsY * 1.5 * dt));
  }

  const running = keys.has('shift');
  const spd = (running ? 9.5 : 5.6);

  // Build a move vector · x = strafe, y = forward
  const mvX = (keys.has('d') || keys.has('arrowright') ? 1 : 0)
            - (keys.has('a') || keys.has('arrowleft')  ? 1 : 0);
  const mvY = (keys.has('w') || keys.has('arrowup')    ? 1 : 0)
            - (keys.has('s') || keys.has('arrowdown')  ? 1 : 0);

  const moving = (mvX !== 0 || mvY !== 0);
  if (moving) {
    // RP9 formula · works, use it verbatim
    _fwd.set(-Math.sin(camRig.yaw), 0, -Math.cos(camRig.yaw));
    _rt.set(-_fwd.z, 0, _fwd.x);
    _dir.copy(_fwd).multiplyScalar(mvY).addScaledVector(_rt, mvX).normalize();
    player.position.addScaledVector(_dir, spd * dt);
    // Face movement direction
    player.rotation.y = Math.atan2(_dir.x, _dir.z);
    playAction(running && playerActions.run ? 'run' : 'walk');
  } else {
    playAction('idle');
  }

  // Gravity + jump
  if (keys.has(' ') && playerState.onGround) {
    playerState.vy = 6.5;
    playerState.onGround = false;
  }
  playerState.vy -= 20 * dt;
  player.position.y += playerState.vy * dt;
  if (player.position.y < 0) {
    player.position.y = 0;
    playerState.vy = 0;
    playerState.onGround = true;
  }

  // ★ RP9 camera position formula (proven working)
  const horizontal = Math.cos(camRig.pitch) * camRig.distance;
  _desiredCam.set(
    player.position.x + Math.sin(camRig.yaw) * horizontal,
    player.position.y + camRig.baseY + Math.sin(camRig.pitch) * camRig.distance,
    player.position.z + Math.cos(camRig.yaw) * horizontal
  );
  camera.position.lerp(_desiredCam, 1 - Math.pow(0.002, dt));
  camera.lookAt(player.position.x, player.position.y + camRig.aimY, player.position.z);
}

// ── Boot · attempt to load first-batch GLBs ─────────────────────────
async function boot() {
  status.textContent = 'Character loading…';
  // Player.glb loads separately (see player setup above).  This function
  // handles world assets like buildings + terrain when they land.
  // (Empty for now · character is Phase 0 · buildings come after.)
  await Promise.resolve();
  status.textContent = 'Ready · walk with left-stick / WASD';
  console.log('[rp10] boot complete');
}
boot();

// ── Render loop ──────────────────────────────────────────────────────
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  pollGamepad();
  updatePlayer(dt);
  if (playerMixer) playerMixer.update(dt);   // ★ drive Mixamo clips
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

// Expose for console debugging
window.RP10 = { scene, camera, player, assetBook, loadGlb };
console.log('[rp10] booted · WASD to move · Space jump · mouse drag to orbit');
</script>
</body>
</html>
