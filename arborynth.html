<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050310"><title>Prototype 08 · Arborynth</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050310;font-family:Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#19112b,#050310 64%);z-index:-1}
.back{position:fixed;right:4.5vw;top:max(18px,env(safe-area-inset-top));z-index:20;color:#c8bed1;text-decoration:none;border:1px solid #30243c;background:#090612;padding:15px 22px;font-size:12px;letter-spacing:.3em}
.device{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding-top:4vh}.chassis{position:relative;width:min(100vw,calc(96vh * 768 / 1376));aspect-ratio:768/1376;overflow:hidden}
.chassis:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:url("assets/controller_frame.png") center/100% 100% no-repeat}
.screen{position:absolute;left:7.5521%;top:6.1047%;width:85.026%;height:50.5814%;z-index:1;overflow:hidden;background:#07110d}
#world{position:absolute;width:1024px;height:1024px;left:0;top:0;will-change:transform}#world>.worldArt{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
#world:after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 20% 30%,#a5f68f 0 1px,transparent 2px),radial-gradient(circle at 75% 60%,#7feac7 0 1px,transparent 2px);background-size:90px 75px,130px 105px;animation:drift 10s linear infinite;pointer-events:none}
#playerHome{position:absolute;z-index:2;left:650px;top:150px;width:280px;height:280px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 8px 8px #0009);pointer-events:none}#homeLabel{position:absolute;z-index:3;left:735px;top:410px;padding:4px 7px;background:#07110dd9;border:1px solid #b99c52;color:#f2dc93;font-size:9px;letter-spacing:.12em;white-space:nowrap;pointer-events:none}
#groundStaff{position:absolute;z-index:2;left:606px;top:617px;width:28px;height:46px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 0 5px #79e7dc);pointer-events:none;animation:itemGlow 1.4s ease-in-out infinite}
.creeper{position:absolute;z-index:3;width:58px;height:64px;transform:translate(-50%,-76%);image-rendering:pixelated;filter:drop-shadow(0 3px 3px #000b);pointer-events:none}
#player{position:absolute;z-index:4;left:50%;top:56%;width:60px;height:60px;transform:translate(-50%,-70%);image-rendering:pixelated;filter:drop-shadow(0 3px 2px #000a);pointer-events:none}
#staffAttack{position:absolute;z-index:4;left:50%;top:56%;width:62px;height:59px;transform:translate(-50%,-70%);background:url("assets/arboryth assets/animations/animation_arborynth_staff_attack.png") 0 center/500% 100% no-repeat;image-rendering:pixelated;filter:drop-shadow(0 3px 2px #000a);pointer-events:none;display:none}
.hud{position:absolute;z-index:5;left:10.5%;right:10.5%;top:12.3%;display:flex;gap:7px;pointer-events:none}.power{flex:1;padding:7px 9px;background:#07110de8;border:1px solid #d1bb67;border-radius:4px;color:#eee3b0;font-size:9px;letter-spacing:.08em;box-shadow:0 3px 12px #0009}.power span{float:right;color:#c9e2d2}.meter{clear:both;height:5px;margin-top:5px;background:#101913}.meter i{display:block;height:100%;width:0}#vibeBar{background:#78db8f}#staffBar{background:#79deda}
#location{position:absolute;z-index:5;left:50%;bottom:9px;transform:translateX(-50%);padding:5px 9px;background:#07110dc2;border:1px solid #8a7e4d;color:#e9d98e;font-size:8px;letter-spacing:.14em;white-space:nowrap;pointer-events:none}
#weaponWheel{position:absolute;z-index:7;right:9px;bottom:38px;width:72px;height:72px;border:2px solid #d0b568;border-radius:50%;background:conic-gradient(from -45deg,#173326 0 50%,#08130f 50% 100%);box-shadow:0 2px 12px #000c,inset 0 0 0 3px #07100c,inset 0 0 0 4px #7c6939;color:#efe1a5;display:grid;place-items:center;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}#weaponWheel:before{content:"";position:absolute;inset:8px;border:1px solid #88733d;border-radius:50%;background:#07110de8}#weaponWheel .weaponIcon{position:relative;z-index:1;width:36px;height:40px;object-fit:contain;image-rendering:pixelated;display:none}#weaponWheel .weaponNone{position:relative;z-index:1;font-size:8px;letter-spacing:.12em}#weaponWheel .wheelKey{position:absolute;z-index:2;right:-2px;top:-6px;width:18px;height:18px;border:1px solid #d0b568;border-radius:50%;display:grid;place-items:center;background:#07110d;color:#f5db89;font:10px Arial}#weaponWheel.staff .weaponIcon{display:block}#weaponWheel.staff .weaponNone{display:none}#weaponWheel.locked{filter:saturate(.45);opacity:.8}
#prompt{position:absolute;z-index:6;left:50%;bottom:42px;transform:translateX(-50%);padding:6px 10px;background:#07110deb;border:1px solid #d7c066;color:#f1e2a0;font-size:8px;letter-spacing:.12em;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}#prompt.show{opacity:1}
#pulse{position:absolute;z-index:3;left:50%;top:54%;width:10px;height:10px;border:2px solid #77ead0;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}#pulse.fire{animation:pulse .7s ease-out}
.hot{position:absolute;z-index:4;border:0;outline:0;background:transparent;padding:0;touch-action:none;-webkit-tap-highlight-color:rgba(0,0,0,0);-webkit-appearance:none;appearance:none;cursor:pointer}.hot:focus,.hot:focus-visible{outline:0;box-shadow:none}.hot:active,.hot.pressed{background:#e8c8781f}
.up{left:14.71%;top:58.43%;width:11.72%;height:6.69%}.down{left:14.71%;top:71.22%;width:11.98%;height:6.69%}.left{left:3.39%;top:64.24%;width:11.98%;height:7.85%}.right{left:26.17%;top:64.24%;width:11.98%;height:7.85%}
.x{left:69.92%;top:60.25%;width:15.36%;height:8.65%;border-radius:50%}.y{left:53.52%;top:68.02%;width:13.67%;height:6.47%;border-radius:50%}.a{left:83.85%;top:68.02%;width:13.54%;height:7.12%;border-radius:50%}.b{left:68.36%;top:75.22%;width:13.54%;height:6.47%;border-radius:50%}.menu{left:38.41%;top:86.48%;width:22.14%;height:11.26%}.start{left:66.15%;top:93.39%;width:22.79%;height:4%}.select{left:11.07%;top:93.39%;width:22.79%;height:4%}
#status{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);color:#776c83;font-size:9px;letter-spacing:.18em;text-transform:uppercase}@keyframes drift{to{background-position:80px -75px,-90px -105px}}@keyframes pulse{0%{opacity:.9;width:10px;height:10px}100%{opacity:0;width:220px;height:220px}}@keyframes itemGlow{50%{filter:drop-shadow(0 0 10px #9af7e9);transform:translateY(-2px)}}
</style></head><body>
<a class="back" href="games.html">← GAMES</a><div class="device"><div class="chassis">
<div class="screen"><div id="world"><canvas class="worldArt" id="tileMap" width="1024" height="1024"></canvas><img id="playerHome" src="assets/arboryth assets/house/house_arborynth_player_base.png" alt=""><div id="homeLabel">PLAYER HOME</div><img id="groundStaff" src="assets/arboryth assets/item/item_aura_staff_ground.png" alt=""></div><div id="pulse"></div><canvas id="player" width="314" height="314" role="img" aria-label="Arborynth traveler"></canvas><div id="staffAttack" aria-hidden="true"></div><div id="prompt"></div><div id="location">FOREST OF THE GODVINE · 32 × 32</div><button id="weaponWheel" type="button" aria-label="Cycle equipped weapon"><span class="wheelKey">X</span><img class="weaponIcon" src="assets/arboryth assets/item/item_aura_staff_ground.png" alt=""><span class="weaponNone">NONE</span></button></div>
<div class="hud"><div class="power">VIBE <span id="vibeLv">LV 1</span><div class="meter"><i id="vibeBar"></i></div></div><div class="power">AURA STAFF <span id="staffLv">LV 1</span><div class="meter"><i id="staffBar"></i></div></div></div>
<button class="hot up" data-key="ArrowUp" aria-label="Move up"></button><button class="hot down" data-key="ArrowDown" aria-label="Move down"></button><button class="hot left" data-key="ArrowLeft" aria-label="Move left"></button><button class="hot right" data-key="ArrowRight" aria-label="Move right"></button>
<button class="hot x" data-action="weapon" aria-label="Cycle equipped weapon"></button><button class="hot y" data-action="vibe" aria-label="Vibe"></button><button class="hot a" data-action="interact" aria-label="Interact"></button><button class="hot b" data-action="attack" aria-label="Basic staff attack"></button><button class="hot menu" data-action="menu" aria-label="Menu"></button><button class="hot start" data-action="staff" aria-label="Staff profile"></button><button class="hot select" data-action="vibe" aria-label="Vibe profile"></button>
</div></div><div id="status">Prototype 08 · Arborynth · Forest of the Godvine</div>
<script>
(()=>{const world=document.querySelector('#world'),tileMap=document.querySelector('#tileMap'),player=document.querySelector('#player'),playerCtx=player.getContext('2d'),groundStaff=document.querySelector('#groundStaff'),prompt=document.querySelector('#prompt'),staffAttack=document.querySelector('#staffAttack'),weaponWheel=document.querySelector('#weaponWheel'),screen=document.querySelector('.screen'),keys={},bounds={w:1024,h:1024},staffPos={x:620,y:640},homeBlock={x:670,y:205,w:220,h:175};let cam={x:512,y:650},last=performance.now(),distance=0,step=0,attacking=false,facing='down',messageTimer,currentWalkImage;const attackSheets={down:'assets/arboryth assets/animations/animation_arborynth_staff_attack.png',up:'assets/arboryth assets/animations/animation_arborynth_staff_attack_up.png',left:'assets/arboryth assets/animations/animation_arborynth_staff_attack_left.png',right:'assets/arboryth assets/animations/animation_arborynth_staff_attack_right.png'},walkImages={none:new Image(),staff:new Image()},creeperImages={idle:new Image(),walk:new Image()};walkImages.none.src='assets/arboryth assets/animations/animation_arborynth_walk.png';walkImages.staff.src='assets/arboryth assets/animations/animation_arborynth_walk_staff.png';creeperImages.idle.src='assets/arboryth assets/verdant-creeper/verdant-creeper-idle-game.png';creeperImages.walk.src='assets/arboryth assets/verdant-creeper/verdant-creeper-walk-game.png';playerCtx.imageSmoothingEnabled=false;const progress=JSON.parse(localStorage.getItem('arborynthProgress')||'{"vibe":{"level":1,"xp":0},"staff":{"level":1,"xp":0}}');progress.hasStaff=!!progress.hasStaff;progress.equipped=progress.hasStaff&&progress.equipped!=='none'?'staff':'none';
const floorTexture=new Image();floorTexture.src='assets/arboryth assets/tile/tile_arborynth_floor.png';floorTexture.onload=()=>{const c=tileMap.getContext('2d');c.imageSmoothingEnabled=false;for(let ty=0;ty<32;ty++)for(let tx=0;tx<32;tx++){const sx=((tx*7+ty*3)%9)*128,sy=((tx*5+ty*8)%9)*128;c.drawImage(floorTexture,sx,sy,128,128,tx*32,ty*32,32,32)}};
function render(){for(const t of ['vibe','staff']){const p=progress[t];document.querySelector(`#${t}Lv`).textContent=`LV ${p.level}`;document.querySelector(`#${t}Bar`).style.width=`${p.xp/(p.level*100)*100}%`}}function gain(t,n){const p=progress[t];p.xp+=n;while(p.xp>=p.level*100){p.xp-=p.level*100;p.level++}localStorage.setItem('arborynthProgress',JSON.stringify(progress));render()}
function showMessage(text){clearTimeout(messageTimer);prompt.textContent=text;prompt.classList.add('show');messageTimer=setTimeout(()=>{prompt.classList.remove('show');messageTimer=null},1500)}
function drawPlayerFrame(frame=0){if(!currentWalkImage?.complete||!currentWalkImage.naturalWidth)return;const rows={up:0,left:1,right:2,down:3},sw=currentWalkImage.naturalWidth/4,sh=currentWalkImage.naturalHeight/4;playerCtx.clearRect(0,0,player.width,player.height);playerCtx.drawImage(currentWalkImage,frame*sw,rows[facing]*sh,sw,sh,0,0,player.width,player.height)}
const creepers=[[250,300],[485,330],[790,720]].map((spawn,i)=>{const canvas=document.createElement('canvas');canvas.className='creeper';canvas.width=256;canvas.height=256;canvas.setAttribute('aria-label','Verdant Creeper');world.appendChild(canvas);return{canvas,ctx:canvas.getContext('2d'),spawn,x:spawn[0],y:spawn[1],facing:['down','left','up'][i],moving:false,changeAt:0,step:i*1.2}});
function chooseCreeperState(enemy,now){enemy.moving=Math.random()>.3;enemy.facing=['up','left','right','down'][Math.floor(Math.random()*4)];enemy.changeAt=now+(enemy.moving?900+Math.random()*1400:650+Math.random()*1100)}
function drawCreeper(enemy){const ctx=enemy.ctx;ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,256,256);if(enemy.moving&&creeperImages.walk.complete&&creeperImages.walk.naturalWidth){const rows={up:0,left:1,right:2,down:3},frame=Math.floor(enemy.step)%4;ctx.drawImage(creeperImages.walk,frame*256,rows[enemy.facing]*256,256,256,0,0,256,256)}else if(creeperImages.idle.complete&&creeperImages.idle.naturalWidth)ctx.drawImage(creeperImages.idle,0,0,256,256)}
function updateCreepers(dt,now){const dirs={up:[0,-1],left:[-1,0],right:[1,0],down:[0,1]};for(const enemy of creepers){if(now>=enemy.changeAt)chooseCreeperState(enemy,now);if(enemy.moving){const [dx,dy]=dirs[enemy.facing],radius=160,nx=enemy.x+dx*42*dt,ny=enemy.y+dy*42*dt,insidePatrol=nx>=enemy.spawn[0]-radius&&nx<=enemy.spawn[0]+radius&&ny>=enemy.spawn[1]-radius&&ny<=enemy.spawn[1]+radius,insideWorld=nx>35&&nx<bounds.w-35&&ny>50&&ny<bounds.h-35,insideHome=nx>homeBlock.x-25&&nx<homeBlock.x+homeBlock.w+25&&ny>homeBlock.y-25&&ny<homeBlock.y+homeBlock.h+25;if(insidePatrol&&insideWorld&&!insideHome){enemy.x=nx;enemy.y=ny;enemy.step+=dt*8}else chooseCreeperState(enemy,now)}enemy.canvas.style.left=`${enemy.x}px`;enemy.canvas.style.top=`${enemy.y}px`;drawCreeper(enemy)}}
function updateEquipment(){const armed=progress.equipped==='staff';currentWalkImage=walkImages[armed?'staff':'none'];currentWalkImage.addEventListener('load',()=>drawPlayerFrame(0),{once:true});drawPlayerFrame(0);weaponWheel.classList.toggle('staff',armed);weaponWheel.classList.toggle('locked',!progress.hasStaff);weaponWheel.setAttribute('aria-label',`Equipped: ${armed?'Aura Staff':'None'}`)}
function cycleWeapon(){if(!progress.hasStaff)return showMessage('WEAPON WHEEL · STAFF NOT ACQUIRED');progress.equipped=progress.equipped==='staff'?'none':'staff';localStorage.setItem('arborynthProgress',JSON.stringify(progress));updateEquipment();showMessage(`EQUIPPED · ${progress.equipped==='staff'?'AURA STAFF':'NONE'}`)}
function equipStaff(){if(progress.hasStaff)return;progress.hasStaff=true;progress.equipped='staff';groundStaff.style.display='none';updateEquipment();localStorage.setItem('arborynthProgress',JSON.stringify(progress));showMessage('AURA STAFF ACQUIRED · EQUIPPED')}
function interact(){if(!progress.hasStaff&&Math.hypot(cam.x-staffPos.x,cam.y-staffPos.y)<72)equipStaff();else showMessage('NOTHING TO INTERACT WITH')}
function basicAttack(){if(!progress.hasStaff)return showMessage('FIND THE AURA STAFF FIRST');if(progress.equipped!=='staff')return showMessage('EQUIP AURA STAFF WITH X');if(attacking)return;attacking=true;player.style.visibility='hidden';staffAttack.style.backgroundImage=`url("${attackSheets[facing]}")`;staffAttack.style.display='block';let frame=0;staffAttack.style.backgroundPosition='0% center';const timer=setInterval(()=>{frame++;if(frame>=5){clearInterval(timer);staffAttack.style.display='none';player.style.visibility='visible';attacking=false;gain('staff',2);return}staffAttack.style.backgroundPosition=`${frame*25}% center`},85)}
function action(type){if(type==='interact')return interact();if(type==='attack')return basicAttack();if(type==='weapon')return cycleWeapon();if(type==='menu')return showMessage('MENU · COMING SOON');if(type==='staff'){if(!progress.hasStaff)return showMessage('AURA STAFF NOT YET ACQUIRED');const p=document.querySelector('#pulse');p.classList.remove('fire');void p.offsetWidth;p.classList.add('fire');player.animate([{filter:'brightness(1)'},{filter:'brightness(1.8) drop-shadow(0 0 8px #7de6de)'},{filter:'brightness(1)'}],{duration:500});gain('staff',4)}else{player.animate([{filter:'brightness(1)'},{filter:'brightness(1.6) drop-shadow(0 0 8px #8ef0b1)'},{filter:'brightness(1)'}],{duration:500});gain('vibe',3)}}
document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;el.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();keys[k]=false}))});document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();action(el.dataset.action)}));
const keyboardButtons={y:'.y',x:'.x',b:'.b',a:'.a','1':'.select','2':'.menu','3':'.start'};addEventListener('keydown',e=>{const arrow=e.key.startsWith('Arrow')?e.key:null,key=e.key.toLowerCase(),selector=keyboardButtons[key];if(!arrow&&!selector)return;e.preventDefault();if(arrow){keys[arrow]=true;document.querySelector(`[data-key="${arrow}"]`)?.classList.add('pressed')}else{const button=document.querySelector(selector);button?.classList.add('pressed');if(!e.repeat&&button?.dataset.action)action(button.dataset.action)}});addEventListener('keyup',e=>{const arrow=e.key.startsWith('Arrow')?e.key:null,key=e.key.toLowerCase(),selector=keyboardButtons[key];if(arrow){keys[arrow]=false;document.querySelector(`[data-key="${arrow}"]`)?.classList.remove('pressed')}if(selector)document.querySelector(selector)?.classList.remove('pressed')});
weaponWheel.addEventListener('pointerdown',e=>{e.preventDefault();cycleWeapon()});
const controller=document.querySelector('.chassis');['dblclick','contextmenu','dragstart','selectstart'].forEach(type=>controller.addEventListener(type,e=>e.preventDefault()));controller.querySelectorAll('img').forEach(img=>img.draggable=false);
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;let dx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),dy=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);if(dx&&dy){dx*=.707;dy*=.707}const moving=dx||dy,s=screen;if(moving&&!attacking){if(Math.abs(dx)>Math.abs(dy))facing=dx<0?'left':'right';else facing=dy<0?'up':'down'}let nx=Math.max(s.clientWidth/2,Math.min(bounds.w-s.clientWidth/2,cam.x+dx*135*dt)),ny=Math.max(s.clientHeight/2,Math.min(bounds.h-s.clientHeight/2,cam.y+dy*135*dt));const blocked=(x,y)=>x>homeBlock.x&&x<homeBlock.x+homeBlock.w&&y>homeBlock.y&&y<homeBlock.y+homeBlock.h;if(!blocked(nx,cam.y))cam.x=nx;if(!blocked(cam.x,ny))cam.y=ny;world.style.transform=`translate(${s.clientWidth/2-cam.x}px,${s.clientHeight/2-cam.y}px)`;if(!progress.hasStaff&&Math.hypot(cam.x-staffPos.x,cam.y-staffPos.y)<72&&!messageTimer){prompt.textContent='PRESS A · PICK UP AURA STAFF';prompt.classList.add('show')}else if(!messageTimer)prompt.classList.remove('show');if(moving){step+=dt*11;distance+=135*dt;if(distance>320){distance=0;gain('vibe',7)}}drawPlayerFrame(moving?Math.floor(step)%4:0);updateCreepers(dt,now);player.style.transform='translate(-50%,-70%)';requestAnimationFrame(loop)}if(progress.hasStaff)groundStaff.style.display='none';updateEquipment();render();requestAnimationFrame(loop)})();
</script></body></html>
