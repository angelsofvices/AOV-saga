<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050310"><title>Prototype 08 · Arborynth</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050310;font-family:Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#19112b,#050310 64%);z-index:-1}
.back{position:fixed;right:4.5vw;top:max(18px,env(safe-area-inset-top));z-index:20;color:#c8bed1;text-decoration:none;border:1px solid #30243c;background:#090612;padding:15px 22px;font-size:12px;letter-spacing:.3em}
.device{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding-top:4vh}.chassis{position:relative;width:min(100vw,calc(96vh * 768 / 1376));aspect-ratio:768/1376;overflow:hidden}
.chassis:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:url("assets/arborynth controller.png") center/100% 100% no-repeat}
.screen{position:absolute;left:7.5521%;top:6.1047%;width:85.026%;height:50.5814%;z-index:1;overflow:hidden;background:#07110d}
#world{position:absolute;width:1100px;height:696px;left:0;top:0;will-change:transform}#world img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;pointer-events:none}
#world:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,#a5f68f 0 1px,transparent 2px),radial-gradient(circle at 75% 60%,#7feac7 0 1px,transparent 2px);background-size:90px 75px,130px 105px;animation:drift 10s linear infinite;pointer-events:none}
#traveler{position:absolute;z-index:4;left:50%;top:54%;width:90px;height:125px;transform:translate(-50%,-58%);object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 6px 4px #0009);pointer-events:none}
.hud{position:absolute;z-index:5;left:10px;right:10px;top:9px;display:flex;gap:7px;pointer-events:none}.power{flex:1;padding:5px 7px;background:#07110dc9;border:1px solid #b7a65f;border-radius:4px;color:#eee3b0;font-size:8px;letter-spacing:.08em}.power span{float:right;color:#c9e2d2}.meter{clear:both;height:4px;margin-top:4px;background:#101913}.meter i{display:block;height:100%;width:0}#vibeBar{background:#78db8f}#staffBar{background:#79deda}
#location{position:absolute;z-index:5;left:50%;bottom:9px;transform:translateX(-50%);padding:5px 9px;background:#07110dc2;border:1px solid #8a7e4d;color:#e9d98e;font-size:8px;letter-spacing:.14em;white-space:nowrap;pointer-events:none}
#pulse{position:absolute;z-index:3;left:50%;top:54%;width:10px;height:10px;border:2px solid #77ead0;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}#pulse.fire{animation:pulse .7s ease-out}
.hot{position:absolute;z-index:4;border:0;background:transparent;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent}.hot:active{background:#e8c8781f}
.up{left:14.71%;top:58.43%;width:11.72%;height:6.69%}.down{left:14.71%;top:71.22%;width:11.98%;height:6.69%}.left{left:3.39%;top:64.24%;width:11.98%;height:7.85%}.right{left:26.17%;top:64.24%;width:11.98%;height:7.85%}
.x{left:69.92%;top:60.25%;width:15.36%;height:8.65%;border-radius:50%}.y{left:53.52%;top:68.02%;width:13.67%;height:6.47%;border-radius:50%}.a{left:83.85%;top:68.02%;width:13.54%;height:7.12%;border-radius:50%}.b{left:68.36%;top:75.22%;width:13.54%;height:6.47%;border-radius:50%}.menu{left:38.41%;top:86.48%;width:22.14%;height:11.26%}.start{left:66.15%;top:93.39%;width:22.79%;height:4%}.select{left:11.07%;top:93.39%;width:22.79%;height:4%}
#status{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);color:#776c83;font-size:9px;letter-spacing:.18em;text-transform:uppercase}@keyframes drift{to{background-position:80px -75px,-90px -105px}}@keyframes pulse{0%{opacity:.9;width:10px;height:10px}100%{opacity:0;width:220px;height:220px}}
</style></head><body>
<a class="back" href="games.html">← GAMES</a><div class="device"><div class="chassis">
<div class="screen"><div id="world"><img src="assets/arborynth-godvine-title.png" alt=""></div><div id="pulse"></div><img id="traveler" src="assets/arborynth-staff-traveler.png" alt="Staff traveler"><div class="hud"><div class="power">VIBE <span id="vibeLv">LV 1</span><div class="meter"><i id="vibeBar"></i></div></div><div class="power">AURA STAFF <span id="staffLv">LV 1</span><div class="meter"><i id="staffBar"></i></div></div></div><div id="location">FOREST OF THE GODVINE</div></div>
<button class="hot up" data-key="ArrowUp" aria-label="Move up"></button><button class="hot down" data-key="ArrowDown" aria-label="Move down"></button><button class="hot left" data-key="ArrowLeft" aria-label="Move left"></button><button class="hot right" data-key="ArrowRight" aria-label="Move right"></button>
<button class="hot x" data-action="staff" aria-label="Aura Staff"></button><button class="hot y" data-action="vibe" aria-label="Vibe"></button><button class="hot a" data-action="staff" aria-label="Aura Staff"></button><button class="hot b" data-action="vibe" aria-label="Vibe"></button><button class="hot menu" aria-label="Menu"></button><button class="hot start" data-action="staff" aria-label="Staff profile"></button><button class="hot select" data-action="vibe" aria-label="Vibe profile"></button>
</div></div><div id="status">Prototype 08 · Arborynth · Forest of the Godvine</div>
<script>
(()=>{const world=document.querySelector('#world'),traveler=document.querySelector('#traveler'),keys={},bounds={w:1100,h:696};let cam={x:550,y:380},last=performance.now(),step=0,distance=0;const progress=JSON.parse(localStorage.getItem('arborynthProgress')||'{"vibe":{"level":1,"xp":0},"staff":{"level":1,"xp":0}}');
function render(){for(const t of ['vibe','staff']){const p=progress[t];document.querySelector(`#${t}Lv`).textContent=`LV ${p.level}`;document.querySelector(`#${t}Bar`).style.width=`${p.xp/(p.level*100)*100}%`}}function gain(t,n){const p=progress[t];p.xp+=n;while(p.xp>=p.level*100){p.xp-=p.level*100;p.level++}localStorage.setItem('arborynthProgress',JSON.stringify(progress));render()}
function action(type){if(type==='staff'){const p=document.querySelector('#pulse');p.classList.remove('fire');void p.offsetWidth;p.classList.add('fire');gain('staff',4)}else{traveler.animate([{filter:'brightness(1)'},{filter:'brightness(1.8) drop-shadow(0 0 12px #8ef0b1)'},{filter:'brightness(1)'}],{duration:500});gain('vibe',3)}}
document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;el.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();keys[k]=false}))});document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();action(el.dataset.action)}));addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='z'||e.key===' ')action('staff');if(e.key==='x'||e.key==='Shift')action('vibe')});addEventListener('keyup',e=>keys[e.key]=false);
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(dx&&dy){dx*=.707;dy*=.707}const moving=dx||dy,s=document.querySelector('.screen');cam.x=Math.max(s.clientWidth/2,Math.min(bounds.w-s.clientWidth/2,cam.x+dx*135*dt));cam.y=Math.max(s.clientHeight/2,Math.min(bounds.h-s.clientHeight/2,cam.y+dy*135*dt));world.style.transform=`translate(${s.clientWidth/2-cam.x}px,${s.clientHeight/2-cam.y}px)`;if(moving){step+=dt*12;traveler.style.transform=`translate(-50%,calc(-58% + ${Math.sin(step)*2}px))`;distance+=135*dt;if(distance>320){distance=0;gain('vibe',7)}}requestAnimationFrame(loop)}render();requestAnimationFrame(loop)})();
</script></body></html>
