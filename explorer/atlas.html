<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14110d" />
  <meta name="robots" content="noindex" />
  <title>World Atlas · The Living Master Codex</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Courier+Prime:wght@400;700&display=swap">
  <style>
    /* ★ 2026-10-07 · WORLD ATLAS · previews every environment in /explorer/environments.js */
    :root{ --bg:#14110d; --panel:#221d17; --panel2:#2c261e; --line:#4a3e2c; --gold:#d9b46a; --gold-hi:#f3d28c; --paper:#efe6d0; --dim:#a99f86; --red:#d24a36;
      --mono:'Courier Prime','Courier New',monospace; --serif:'Cinzel',serif; color-scheme:dark; }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--mono);font-size:14px}
    button{font:inherit;color:inherit;cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:.4rem .65rem}
    button:hover{border-color:var(--gold)}
    button.on{background:var(--gold);color:#1a140c;border-color:var(--gold)}
    button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
    header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
    header h1{font-family:var(--serif);font-size:1.05rem;letter-spacing:.1em;margin:0;color:var(--gold-hi)}
    header p{margin:2px 0 0;color:var(--dim);font-size:.78rem}
    header a{color:var(--gold-hi)}
    .wrap{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 62px)}
    @media (max-width:860px){ .wrap{grid-template-columns:1fr} #list{max-height:200px} }
    #list{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 62px)}
    #list h2{font-family:var(--serif);font-size:.72rem;letter-spacing:.14em;color:var(--dim);margin:12px 12px 4px}
    #list button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-radius:0;background:none;padding:.4rem 12px}
    #list button:hover{background:var(--panel2)}
    #list button.on{background:var(--panel2);color:var(--gold-hi);box-shadow:inset 3px 0 var(--gold)}
    #list .sw{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid #0006}
    #list .no{color:var(--dim);width:1.6em;flex:none;text-align:right}
    main{padding:16px;max-width:1100px}
    .top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
    .view{flex:1 1 420px;min-width:0}
    canvas#map{display:block;width:100%;height:auto;image-rendering:pixelated;border:3px solid #3b2d18;border-radius:6px;background:#000}
    .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .side{flex:1 1 300px;min-width:0}
    .k{font-family:var(--serif);font-size:.7rem;letter-spacing:.16em;color:var(--dim);margin:0}
    h3{font-family:var(--serif);font-size:1.5rem;letter-spacing:.08em;margin:2px 0;color:var(--gold-hi)}
    .sub{margin:0 0 10px;color:var(--paper);letter-spacing:.06em}
    .scope{background:#0d0b08;border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:#cfe6c8;font-size:.82rem;letter-spacing:.04em}
    .scope b{color:var(--dim);font-weight:400;display:block;font-size:.68rem;letter-spacing:.14em}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
    .chip{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:.76rem}
    .chip img{width:32px;height:32px;image-rendering:pixelated}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:14px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
    .card h4{font-family:var(--serif);font-size:.74rem;letter-spacing:.14em;color:var(--gold);margin:0 0 6px}
    .card p,.card li{margin:0 0 6px;line-height:1.45;font-size:.86rem}
    .card ul{margin:0;padding-left:1.1em}
    .card .nm{color:var(--gold-hi)}
    .pal{display:flex;flex-wrap:wrap;gap:3px}
    .pal span{width:18px;height:18px;border-radius:3px;border:1px solid #0008}
    .spoil{border:1px dashed var(--red);padding:14px;border-radius:6px;text-align:center;margin-top:12px}
    .spoil p{color:var(--dim)}
  </style>
</head>
<body>
<header>
  <div>
    <h1>WORLD ATLAS</h1>
    <p>Every environment of the Living Master Codex, drawn in native pocket tiles. Design bible: docs/card-explorer/03_ENVIRONMENTS.md</p>
  </div>
  <div><a href="/explorer/studio.html">ART STUDIO</a> · <a href="/explorer/" target="_blank" rel="noopener">OPEN THE GAME ↗</a></div>
</header>
<div class="wrap">
  <nav id="list" aria-label="Environments"></nav>
  <main id="main"></main>
</div>
<script src="/explorer/art.js"></script>
<script src="/explorer/environments.js"></script>
<script>
(function(){
  var ART = window.AOV_ART, ENV = window.AOV_ENV || [];
  var T = 16, W = 22, H = 14, cur = null, seed = 1, showProps = true, revealed = {}, frameN = 0, timer = null;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function rng(s){ return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
  function hashId(id){ var h = 2166136261; for (var i = 0; i < id.length; i++) h = Math.imul(h ^ id.charCodeAt(i), 16777619) >>> 0; return h; }

  // a seeded sample pocket map: border cliffs, a liquid body, a winding path, scattered specials and props
  function genMap(e, sd){
    var r = rng(hashId(e.id) + sd * 7919), m = [], i, x, y;
    for (y = 0; y < H; y++) { m.push([]); for (x = 0; x < W; x++) m[y].push('g'); }
    for (x = 0; x < W; x++) { m[0][x] = 'w'; m[H-1][x] = 'w'; if (r() < .5) m[1][x] = 'w'; if (r() < .4) m[H-2][x] = 'w'; }
    for (y = 0; y < H; y++) { m[y][0] = 'w'; m[y][W-1] = 'w'; if (r() < .4) m[y][1] = 'w'; }
    var lx = 4 + (r() * (W - 10)) | 0, ly = 3 + (r() * (H - 7)) | 0, lr = 2 + r() * 2;
    for (y = 1; y < H-1; y++) for (x = 1; x < W-1; x++) {
      var d = Math.hypot((x - lx) * .8, y - ly) + r() * 1.1;
      if (d < lr) m[y][x] = 'l';
    }
    y = 2 + (r() * (H - 4)) | 0;
    for (x = 1; x < W-1; x++) {
      if (m[y][x] !== 'l') m[y][x] = 'p';
      if (r() < .25) { var ny = Math.max(2, Math.min(H-3, y + (r() < .5 ? -1 : 1))); if (m[ny][x] !== 'l') m[ny][x] = 'p'; y = ny; }
    }
    var props = [];
    for (i = 0; i < 26; i++) {
      x = 2 + (r() * (W - 4)) | 0; y = 2 + (r() * (H - 4)) | 0;
      if (m[y][x] !== 'g') continue;
      if (e.tiles.special && r() < .35) m[y][x] = 's';
      else if (e.props.length && r() < .55) { props.push({ x:x, y:y, p:e.props[(r() * e.props.length) | 0] }); m[y][x] = 'o'; }
    }
    return { m:m, props:props };
  }
  function tileSpec(e, k, n){
    var key = { g:'ground', p:'path', l:'liquid', w:'wall', s:'special', o:'ground' }[k], name = e.tiles[key];
    if (name === 'water' && n % 2) name = 'water1';
    return name + '@' + e.id + '-' + key;
  }
  function render(){
    var cv = document.getElementById('map'); if (!cv || !cur) return;
    var g = cv.getContext('2d'), z = 3, mp = cur._map;
    cv.width = W * T * z; cv.height = H * T * z; g.imageSmoothingEnabled = false;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var k = mp.m[y][x];
      if (k === 'w' || k === 's' || k === 'p' || k === 'l') ART.draw(g, tileSpec(cur, 'g', 0), (x + .5) * T * z, (y + 1) * T * z, z);
      ART.draw(g, tileSpec(cur, k, frameN), (x + .5) * T * z, (y + 1) * T * z, z);
    }
    if (showProps) mp.props.slice().sort(function(a, b){ return a.y - b.y; }).forEach(function(o){
      ART.draw(g, o.p[0] + (o.p[1] ? '@' + cur.id + '-' + o.p[1] : ''), (o.x + .5) * T * z, (o.y + 1) * T * z, z);
    });
    ART.draw(g, ART.frame('carl', 'down', 0), (W / 2 + .5) * T * z, (H / 2 + 1) * T * z, z);
  }
  function swatches(p){
    var out = '', seen = {};
    Object.keys(p || {}).forEach(function(k){ var v = p[k]; if (typeof v !== 'object') return; for (var c in v) if (!seen[v[c]]) { seen[v[c]] = 1; out += '<span title="' + esc(k + ' · ' + c + ' ' + v[c]) + '" style="background:' + v[c] + '"></span>'; } });
    return out;
  }
  function chip(spec, label){ return '<span class="chip"><img alt="" src="' + ART.url(spec, 2) + '">' + esc(label) + '</span>'; }
  function show(e){
    cur = e; seed = 1; e._map = genMap(e, seed);
    [].forEach.call(document.querySelectorAll('#list button'), function(b){ b.classList.toggle('on', b.dataset.id === e.id); });
    var main = document.getElementById('main');
    if (e.spoiler && !revealed[e.id]) {
      main.innerHTML = '<p class="k">' + (e.kind === 'world' ? 'WORLD ' + e.no : 'DISTRICT') + '</p><h3>SEALED</h3>' +
        '<div class="spoil"><p>This entry is a story spoiler and is not designed yet.</p><button id="reveal">REVEAL THE NOTES</button></div>';
      document.getElementById('reveal').onclick = function(){ revealed[e.id] = 1; show(e); };
      return;
    }
    var c = e.canon || {}, tiles = e.tiles, chips = '';
    ['ground','path','liquid','wall','special'].forEach(function(k){ if (tiles[k]) chips += chip(tiles[k] + '@' + e.id + '-' + k, k); });
    e.props.forEach(function(p){ chips += chip(p[0] + (p[1] ? '@' + e.id + '-' + p[1] : ''), p[0]); });
    main.innerHTML =
      '<div class="top"><div class="view"><canvas id="map" width="1056" height="672" aria-label="Sample pocket map of ' + esc(e.name) + '"></canvas>' +
        '<div class="tools"><button id="reroll">NEW SAMPLE</button><button id="tprops" class="' + (showProps ? 'on' : '') + '">PROPS</button>' +
        '<button id="tanim" class="' + (timer ? 'on' : '') + '">ANIMATE</button></div></div>' +
      '<div class="side"><p class="k">' + (e.kind === 'world' ? 'WORLD ' + e.no + ' OF 28' : 'ZYRAXIS · DISTRICT' + (e.lord ? ' · ' + esc(e.lord.toUpperCase()) : '')) + '</p>' +
        '<h3>' + esc(e.name) + '</h3><p class="sub">' + esc((e.title || '').toUpperCase()) + '</p>' +
        (e.telescope ? '<div class="scope"><b>1936 · CARL’S TELESCOPE</b>' + esc(e.telescope) + '</div>' : '') +
        '<div class="chips">' + chips + '</div><div class="pal">' + swatches(e.palette) + swatches(e.prop_palette) + '</div></div></div>' +
      '<div class="grid">' +
        '<div class="card"><h4>CONCEPT</h4><p>' + esc(e.concept) + '</p><p><span class="nm">Mood:</span> ' + esc(e.mood) + '</p></div>' +
        '<div class="card"><h4>TERRAIN</h4><ul>' + (e.terrain || []).map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="card"><h4>HAZARD</h4><p class="nm">' + esc(e.hazard && e.hazard.name) + '</p><p>' + esc(e.hazard && e.hazard.rule) + '</p></div>' +
        '<div class="card"><h4>SIGNATURE MECHANIC</h4><p class="nm">' + esc(e.mechanic && e.mechanic.name) + '</p><p>' + esc(e.mechanic && e.mechanic.rule) + '</p></div>' +
        '<div class="card"><h4>CANON LANDMARKS</h4>' + ((e.landmarks || []).length ? '<ul>' + e.landmarks.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '<p>None named in canon yet.</p>') + '</div>' +
        '<div class="card"><h4>FROM THE CODEX</h4>' +
          (c.trait ? '<p><span class="nm">Trait:</span> ' + esc(c.trait) + '</p>' : '') +
          (c.firstRace ? '<p><span class="nm">First race:</span> ' + esc(c.firstRace) + '</p>' : '') +
          (c.notable ? '<p><span class="nm">Notable:</span> ' + esc(c.notable) + '</p>' : '') +
          (c.notes ? '<p>' + esc(c.notes) + '</p>' : '') +
          (e.gem ? '<p><span class="nm">Gem:</span> ' + esc(e.gem) + '</p>' : '') +
          (e.land ? '<p><span class="nm">Land:</span> ' + esc(e.land) + '</p>' : '') + '</div>' +
      '</div>';
    document.getElementById('reroll').onclick = function(){ seed++; e._map = genMap(e, seed); render(); };
    document.getElementById('tprops').onclick = function(){ showProps = !showProps; this.classList.toggle('on', showProps); render(); };
    document.getElementById('tanim').onclick = function(){
      if (timer) { clearInterval(timer); timer = null; } else timer = setInterval(function(){ frameN++; render(); }, 600);
      this.classList.toggle('on', !!timer);
    };
    render();
    try { history.replaceState(null, '', '#' + e.id); } catch(err){}
  }
  function swatch(e){ var p = e.palette && e.palette.ground; return p ? p[Object.keys(p)[0]] : '#555'; }
  var list = document.getElementById('list'), html = '<h2>THE 28 WORLDS</h2>';
  ENV.filter(function(e){ return e.kind === 'world'; }).forEach(function(e){
    html += '<button data-id="' + e.id + '"><span class="no">' + e.no + '</span><span class="sw" style="background:' + swatch(e) + '"></span>' + esc(e.spoiler ? '???' : e.name) + '</button>';
  });
  html += '<h2>ZYRAXIS · THE TEN DISTRICTS</h2>';
  ENV.filter(function(e){ return e.kind !== 'world'; }).forEach(function(e){
    html += '<button data-id="' + e.id + '"><span class="no">·</span><span class="sw" style="background:' + swatch(e) + '"></span>' + esc(e.name) + '</button>';
  });
  list.innerHTML = html;
  list.addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if (!b) return;
    var e = ENV.filter(function(x){ return x.id === b.dataset.id; })[0]; if (e) show(e);
  });
  var start = ENV.filter(function(x){ return x.id === location.hash.slice(1); })[0] || ENV.filter(function(x){ return x.no === 9 && x.kind === 'world'; })[0] || ENV[0];
  if (start) show(start);
})();
</script>
</body>
</html>
