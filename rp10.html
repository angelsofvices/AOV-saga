<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RP10 · The Rize of Power 3D</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden;
    font-family: 'VT323', monospace; color:#e8c878; }
  #stage { position:fixed; inset:0; display:block; }
  #hud { position:fixed; top:6px; left:6px; z-index:10;
    background:rgba(5,3,16,.82); border:1px solid rgba(232,200,120,.35);
    padding:6px 10px; font-size:14px; letter-spacing:.1em; }
  #load-status { position:fixed; top:6px; right:6px; z-index:10;
    background:rgba(5,3,16,.82); border:1px solid rgba(232,200,120,.35);
    padding:4px 8px; font-size:11px; color:#8080a0; }
  #controls { position:fixed; bottom:8px; left:8px; z-index:10;
    background:rgba(5,3,16,.82); border:1px solid rgba(232,200,120,.35);
    padding:4px 8px; font-size:12px; color:#b8aec8; letter-spacing:.12em; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud">RP10 · Malezor Resident<br/>3D · Blender-authored assets</div>
<div id="load-status">Booting Three.js…</div>
<noscript><div style="color:#f88;padding:20px">JavaScript disabled — RP10 requires JS + WebGL.</div></noscript>
<div id="controls">WASD move · Space jump · Mouse orbit · Shift run</div>

<script type="importmap">
{
  "imports": {
    "three":            "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader }  from 'three/addons/loaders/FBXLoader.js';

/* ============================================================================
 * RP10 · 3D RIZE OF POWER · SCAFFOLDING v0.1
 * ----------------------------------------------------------------------------
 * Blender + Hyper3D-generated GLBs load from assets/rp10/models/*.glb.
 * Three.js runtime with GLTFLoader, orbit-tilt camera, WASD character
 * controller (capsule + ground raycast), directional sun + ambient fill.
 *
 * Blender MCP pipeline (per session):
 *   1. Launch Blender · enable the MCP addon panel · connect
 *   2. From Claude: generate_hyper3d_model_via_text('...') → import → export GLB
 *   3. Drop GLB into assets/rp10/models/  → assetBook picks it up on reload
 *
 * PIPELINE STATUS
 *   ✓ scene · lights · sky · ground plane
 *   ✓ WASD character controller · capsule collider · raycast ground
 *   ✓ GLB loader wired · pulls from assets/rp10/models/*.glb
 *   ✓ Debug camera orbit (mouse drag) · perspective + fallback ortho tilt
 *   ✗ Blender GLB assets (waiting for first hyper3d generation)
 *   ✗ Terrain heightmap · districts · portals · combat
 * ========================================================================== */

// ── Constants ────────────────────────────────────────────────────────
const ASSETS = 'assets/rp10';
const MODELS = `${ASSETS}/models`;

// ── Renderer + scene ─────────────────────────────────────────────────
const canvas = document.getElementById('stage');
const status = document.getElementById('load-status');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);   // sky blue placeholder
scene.fog = new THREE.Fog(0x87ceeb, 40, 120);

// ★ Third-person perspective camera · trails behind the player
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 500);
// Camera state · rotates around player based on right-stick / mouse
const camRig = {
  yaw:   0,           // horizontal rotation (radians)
  pitch: 0.5,         // vertical tilt · ~30° above horizon
  distance: 7,        // meters behind the player
  height:   3,        // meters above player root
  lookAtHeight: 1.2,  // aim at chest, not feet
};
camera.position.set(0, camRig.height, camRig.distance);
camera.lookAt(0, camRig.lookAtHeight, 0);

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});

// ── Lights ───────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.1);
sun.position.set(15, 25, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 80;
scene.add(sun);

// ── Ground plane (placeholder · replaced by terrain in Phase 1) ─────
const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a8a56, roughness: 0.9 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid overlay so we can see tile bounds during dev
const grid = new THREE.GridHelper(60, 60, 0x203020, 0x203020);
grid.position.y = 0.01;
scene.add(grid);

// ── GLB loader + asset book ──────────────────────────────────────────
const gltfLoader = new GLTFLoader();
const assetBook = {};   // { slug: THREE.Group }

function loadGlb(slug, path, position = [0, 0, 0], scale = 1) {
  return new Promise((resolve) => {
    gltfLoader.load(
      path,
      (gltf) => {
        const g = gltf.scene;
        g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
        g.position.set(...position);
        g.scale.setScalar(scale);
        scene.add(g);
        assetBook[slug] = g;
        console.log(`[rp10] loaded ${slug} from ${path}`);
        resolve(g);
      },
      undefined,
      (err) => {
        console.warn(`[rp10] ${slug} MISSING at ${path} · placeholder shown`);
        // Placeholder cube so the scene isn't empty while assets bake
        const cube = new THREE.Mesh(
          new THREE.BoxGeometry(2, 3, 2),
          new THREE.MeshStandardMaterial({ color: 0x8a5a30, wireframe: false })
        );
        cube.position.set(...position);
        cube.castShadow = true;
        scene.add(cube);
        assetBook[slug] = cube;
        resolve(cube);
      }
    );
  });
}

// ── Player · Mixamo-rigged FBX with Idle animation ─────────────────
// Idle.fbx (from Mixamo auto-rig) includes both the skinned chibi mesh
// AND the idle animation clip.  We load the FBX as the character mesh
// and drive its embedded animation via AnimationMixer.  Future clips
// (walk / run / attack) go into the same clips array.
const player = new THREE.Group();
player.position.set(0, 0, 0);
scene.add(player);

let playerMixer = null;
const playerActions = {};   // { idle, walk, run, attackLight, attackHeavy, jump }
let currentAction = null;   // AnimationAction currently playing

// Cross-fade helper · 0.15s blend between clips
function playAction(name, fadeMs = 150) {
  const next = playerActions[name];
  if (!next || next === currentAction) return;
  next.reset().setEffectiveWeight(1).fadeIn(fadeMs / 1000).play();
  if (currentAction) currentAction.fadeOut(fadeMs / 1000);
  currentAction = next;
}

// Visible RED CAPSULE placeholder · replaced when Idle.fbx streams in.
// So we always know the player exists in the scene even if the FBX fails.
const _placeholder = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.4, 1.0, 4, 8),
  new THREE.MeshStandardMaterial({ color: 0xd83030 })
);
_placeholder.position.y = 0.9;
_placeholder.castShadow = true;
player.add(_placeholder);

// Load rigged mesh + Idle animation first · walking.fbx clip attaches later
new FBXLoader().load(`${MODELS}/animations/idle.fbx`, (fbx) => {
  // FBX loaded successfully · drop the placeholder
  player.remove(_placeholder);
  _placeholder.geometry.dispose();
  _placeholder.material.dispose();
  const model = fbx;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3(); box.getSize(size);
  const TARGET_H = 1.7;
  const scale = TARGET_H / size.y;
  model.scale.setScalar(scale);
  const box2 = new THREE.Box3().setFromObject(model);
  const center2 = new THREE.Vector3(); box2.getCenter(center2);
  model.position.y = -box2.min.y;
  model.position.x = -center2.x;
  model.position.z = -center2.z;
  player.add(model);

  playerMixer = new THREE.AnimationMixer(model);

  if (fbx.animations && fbx.animations.length) {
    playerActions.idle = playerMixer.clipAction(fbx.animations[0]);
    playAction('idle', 0);
    console.log(`[rp10] idle clip loaded · ${fbx.animations[0].duration.toFixed(2)}s`);
  }

  // ── Load additional clips onto the SAME mixer ──────────────────────
  // Mixamo exports each animation with its own copy of the rig · we only
  // want the animation TRACKS, so we grab clip[0] from each and re-target
  // to the mixer bound to our first FBX's skeleton.
  const extraClips = [
    ['walk', 'walking.fbx'],
    // ['run',         'running.fbx'],       // add as clips arrive
    // ['attackLight', 'sword_slash.fbx'],
    // ['attackHeavy', 'great_sword_slash.fbx'],
    // ['jump',        'jumping.fbx'],
  ];
  for (const [name, file] of extraClips) {
    new FBXLoader().load(`${MODELS}/animations/${file}`, (loaded) => {
      if (!loaded.animations || !loaded.animations.length) {
        console.warn(`[rp10] ${file} · no animation clip found`);
        return;
      }
      const clip = loaded.animations[0];
      clip.name = name;
      playerActions[name] = playerMixer.clipAction(clip);
      console.log(`[rp10] ${name} clip loaded · ${clip.duration.toFixed(2)}s`);
    });
  }

  console.log(`[rp10] player rig loaded · scaled to ${TARGET_H}m (was ${size.y.toFixed(2)}m native)`);
}, undefined, (err) => {
  console.error('[rp10] FAILED to load idle.fbx · placeholder stays visible', err);
  const s = document.getElementById('load-status');
  if (s) s.textContent = 'FBX load failed · check console';
});

const playerState = { vy: 0, onGround: true, speed: 5.5, runMult: 1.7 };

// ── Input · keyboard + PS5 DualSense (locked mappings) ─────────────
// ★ CANON per [[aov-controller-priority]] — every AOV build ships with
// working controller from day one.  PS5 button → keyboard key mapping is
// LOCKED to match rp7b so muscle memory transfers between builds:
//   Cross (×)   → 'z'      confirm / interact / jump
//   Circle (○)  → 'shift'  run
//   Square (□)  → 'x'      light attack
//   Triangle (△)→ 'y'      heavy attack
//   R1          → 'r'      cycle mount (later)
//   L1          → 'l'      party menu (later)
//   Options     → 'escape' pause
//   D-Pad + LS  → WASD / arrow-keys (movement)
const keys = new Set();
window.addEventListener('keydown', e => keys.add(e.key.toLowerCase()));
window.addEventListener('keyup',   e => keys.delete(e.key.toLowerCase()));

// PS5 DualSense standard-gamepad-mapping button index → RP-canon key.
const PAD_BTN = {
  0: 'z',       // Cross
  1: 'shift',   // Circle
  2: 'x',       // Square
  3: 'y',       // Triangle
  4: 'l',       // L1
  5: 'r',       // R1
  9: 'escape',  // Options
  12: 'arrowup', 13: 'arrowdown', 14: 'arrowleft', 15: 'arrowright',   // D-Pad
};
const PAD_DEAD = 0.35;   // analog stick deadzone
const pressed = new Set();
let padActive = null;

window.addEventListener('gamepadconnected', (e) => {
  padActive = e.gamepad.index;
  console.log(`[rp10] gamepad · ${e.gamepad.id}`);
  const el = document.getElementById('controls');
  if (el) el.textContent = 'DUALSENSE · ' + e.gamepad.id.split('(')[0].trim() + ' · × confirm · ○ run';
});

function pollGamepad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const pad  = pads[padActive] || pads.find(p => p);
  if (!pad) return;
  // Buttons
  for (const i in PAD_BTN) {
    const key = PAD_BTN[i];
    if (pad.buttons[i] && pad.buttons[i].pressed) {
      if (!pressed.has(key)) {
        pressed.add(key);
        keys.add(key);
        if (key === 'z') keys.add(' ');   // Cross also fires Space (jump)
      }
    } else if (pressed.has(key)) {
      pressed.delete(key);
      keys.delete(key);
      if (key === 'z') keys.delete(' ');
    }
  }
  // Left stick → WASD equivalents
  const lx = pad.axes[0] || 0, ly = pad.axes[1] || 0;
  const setAxis = (key, on) => on ? keys.add(key) : keys.delete(key);
  setAxis('w', ly < -PAD_DEAD);
  setAxis('s', ly >  PAD_DEAD);
  setAxis('a', lx < -PAD_DEAD);
  setAxis('d', lx >  PAD_DEAD);
}

// ── Mouse look (drag with LMB) — RMB and R-stick also drive camera yaw
let dragging = false, lastMx = 0, lastMy = 0;
canvas.addEventListener('mousedown', (e) => { dragging = true; lastMx = e.clientX; lastMy = e.clientY; });
window.addEventListener('mouseup',   () => dragging = false);
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastMx, dy = e.clientY - lastMy;
  // ★ 2026-08-04 · Fixed mirror to match right-stick convention:
  //   mouse RIGHT → camera pans clockwise · mouse DOWN → look down.
  camRig.yaw   += dx * 0.005;
  camRig.pitch  = Math.max(0.1, Math.min(1.3, camRig.pitch - dy * 0.005));
  lastMx = e.clientX; lastMy = e.clientY;
});
// Right-stick camera look (added into pollGamepad via pad.axes[2],[3])
let rsX = 0, rsY = 0;
const _origPollGamepad = pollGamepad;
pollGamepad = function() {
  _origPollGamepad();
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const pad = pads[padActive] || pads.find(p => p);
  if (!pad) return;
  const rx = pad.axes[2] || 0, ry = pad.axes[3] || 0;
  rsX = Math.abs(rx) > PAD_DEAD ? rx : 0;
  rsY = Math.abs(ry) > PAD_DEAD ? ry : 0;
};

// ── Third-person character controller · WASD + Space jump ─────────
function updatePlayer(dt) {
  // Camera yaw + pitch from right stick.
  // ★ 2026-08-04 · Fixed mirror · standard TP convention:
  //   RS RIGHT → camera pans clockwise (yaw INCREASES)
  //   RS DOWN  → look DOWN (pitch DECREASES)
  if (rsX || rsY) {
    camRig.yaw   += rsX * 2.4 * dt;
    camRig.pitch  = Math.max(0.1, Math.min(1.3, camRig.pitch - rsY * 1.8 * dt));
  }

  const running = keys.has('shift');
  const spd = playerState.speed * (running ? playerState.runMult : 1);

  // Movement is RELATIVE TO CAMERA YAW (third-person feel)
  // ★ 2026-08-04 · forward vector flipped (was pointing at camera) · W now
  // moves player AWAY from camera as expected · A/S/D follow the same fix.
  const yaw = camRig.yaw;
  const forward = new THREE.Vector3( Math.sin(yaw), 0,  Math.cos(yaw));
  const right   = new THREE.Vector3( Math.cos(yaw), 0, -Math.sin(yaw));

  const move = new THREE.Vector3();
  if (keys.has('w') || keys.has('arrowup'))    move.add(forward);
  if (keys.has('s') || keys.has('arrowdown'))  move.sub(forward);
  if (keys.has('d') || keys.has('arrowright')) move.add(right);
  if (keys.has('a') || keys.has('arrowleft'))  move.sub(right);

  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(spd * dt);
    player.position.add(move);
    const targetYaw = Math.atan2(move.x, move.z);
    player.rotation.y += (targetYaw - player.rotation.y) * 0.25;
    // ★ Anim state · switch to walk (or run · TBD when running clip lands)
    playAction(running && playerActions.run ? 'run' : 'walk');
  } else {
    // ★ Anim state · idle when no movement
    playAction('idle');
  }

  // Gravity + jump
  if (keys.has(' ') && playerState.onGround) {
    playerState.vy = 6.5;
    playerState.onGround = false;
  }
  playerState.vy -= 20 * dt;
  player.position.y += playerState.vy * dt;
  // ★ 2026-08-04 · Feet-at-0 ground clamp · player is a Group with model
  // shifted up so its own bbox.min sits at local y=0.  Group's world y
  // therefore equals foot height.
  if (player.position.y < 0) {
    player.position.y = 0;
    playerState.vy = 0;
    playerState.onGround = true;
  }

  // Third-person camera follows player
  const cy = Math.cos(camRig.yaw), sy = Math.sin(camRig.yaw);
  const cp = Math.cos(camRig.pitch), sp = Math.sin(camRig.pitch);
  const camOffX = -sy * camRig.distance * cp;
  const camOffZ = -cy * camRig.distance * cp;
  const camOffY = camRig.height + camRig.distance * sp * 0.5;
  const targetCamPos = new THREE.Vector3(
    player.position.x + camOffX,
    player.position.y + camOffY,
    player.position.z + camOffZ
  );
  camera.position.lerp(targetCamPos, 0.18);
  camera.lookAt(player.position.x, player.position.y + camRig.lookAtHeight, player.position.z);
}

// ── Boot · attempt to load first-batch GLBs ─────────────────────────
async function boot() {
  status.textContent = 'Character loading…';
  // Player.glb loads separately (see player setup above).  This function
  // handles world assets like buildings + terrain when they land.
  // (Empty for now · character is Phase 0 · buildings come after.)
  await Promise.resolve();
  status.textContent = 'Ready · walk with left-stick / WASD';
  console.log('[rp10] boot complete');
}
boot();

// ── Render loop ──────────────────────────────────────────────────────
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(0.05, clock.getDelta());
  pollGamepad();
  updatePlayer(dt);
  if (playerMixer) playerMixer.update(dt);   // ★ drive Mixamo clips
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

// Expose for console debugging
window.RP10 = { scene, camera, player, assetBook, loadGlb };
console.log('[rp10] booted · WASD to move · Space jump · mouse drag to orbit');
</script>
</body>
</html>
