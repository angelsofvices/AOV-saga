function updateCreepers(dt,now){if(scene!=='outdoor'||region!=='south')return;const dirs={up:[0,-1],left:[-1,0],right:[1,0],down:[0,1]};for(const enemy of creepers){if(!enemy.alive)continue;const toPlayerX=cam.x-enemy.x,toPlayerY=cam.y-enemy.y,playerDistance=Math.hypot(toPlayerX,toPlayerY),nearPlayer=!playerDead&&playerDistance<150;if(enemy.attacking){const elapsed=now-enemy.attackStarted;enemy.attackFrame=Math.min(4,Math.floor(elapsed/105));if(enemy.attackFrame>=3)resolveCreeperHit(enemy,now);if(elapsed>=525){enemy.attacking=false;enemy.attackFrame=0;enemy.changeAt=now+300}}else{if(nearPlayer){enemy.moving=playerDistance>43;if(Math.abs(toPlayerX)>Math.abs(toPlayerY))enemy.facing=toPlayerX<0?'left':'right';else enemy.facing=toPlayerY<0?'up':'down'}else if(now>=enemy.changeAt)chooseCreeperState(enemy,now);if(playerDistance<56&&now>=enemy.nextAttack)startCreeperAttack(enemy,now);if(enemy.moving&&!enemy.attacking){const [dx,dy]=dirs[enemy.facing],radius=160,nx=enemy.x+dx*(nearPlayer?55:42)*dt,ny=enemy.y+dy*(nearPlayer?55:42)*dt,insidePatrol=nx>=enemy.spawn[0]-radius&&nx<=enemy.spawn[0]+radius&&ny>=enemy.spawn[1]-radius&&ny<=enemy.spawn[1]+radius,insideWorld=nx>35&&nx<bounds.w-35&&ny>50&&ny<bounds.h-35,playerClear=Math.hypot(nx-cam.x,ny-cam.y)>=40,enemyClear=creepers.every(other=>other===enemy||!other.alive||Math.hypot(nx-other.x,ny-other.y)>=34);if(insidePatrol&&insideWorld&&playerClear&&enemyClear){enemy.x=nx;enemy.y=ny;enemy.step+=dt*8}else if(!nearPlayer)chooseCreeperState(enemy,now)}}enemy.canvas.style.left=`${enemy.x}px`;enemy.canvas.style.top=`${enemy.y}px`;drawCreeper(enemy)}}

function hitCreeper(){if(region!=='south')return;const vectors={up:[0,-1],left:[-1,0],right:[1,0],down:[0,1]},[fx,fy]=vectors[facing];let target=null,best=86;for(const enemy of creepers){if(!enemy.alive)continue;const dx=enemy.x-cam.x,dy=enemy.y-cam.y,d=Math.hypot(dx,dy),dot=(dx*fx+dy*fy)/(d||1);if(d<best&&dot>.1){target=enemy;best=d}}if(!target)return;target.hp--;target.canvas.animate([{filter:'brightness(1)'},{filter:'brightness(3) sepia(1)'},{filter:'brightness(1)'}],{duration:220});if(target.hp<=0){target.alive=false;target.canvas.style.display='none';showMessage('VERDANT CREEPER DEFEATED');gain('staff',12)}else showMessage(`CREEPER HIT · ${target.hp}/5`)}

function action(type){if(playerDead){if(type==='staff')revivePlayer();return}if(type==='interact')return interact();if(type==='attack')return basicAttack();if(type==='weapon')return cycleWeapon();if(type==='menu')return showMessage('MENU · COMING SOON');if(type==='staff'){if(!progress.hasStaff)return showMessage('AURA STAFF NOT YET ACQUIRED');const p=document.querySelector('#pulse');p.classList.remove('fire');void p.offsetWidth;p.classList.add('fire');player.animate([{filter:'brightness(1)'},{filter:'brightness(1.8) drop-shadow(0 0 8px #7de6de)'},{filter:'brightness(1)'}],{duration:500});gain('staff',4)}else{player.animate([{filter:'brightness(1)'},{filter:'brightness(1.6) drop-shadow(0 0 8px #8ef0b1)'},{filter:'brightness(1)'}],{duration:500});gain('vibe',3)}}
document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;el.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();keys[k]=false}))});document.querySelectorAll('[data-action]:not([data-action="block"])').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();action(el.dataset.action)}));const blockButton=document.querySelector('[data-action="block"]');blockButton.addEventListener('pointerdown',e=>{e.preventDefault();setBlocking(true);blockButton.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(n=>blockButton.addEventListener(n,e=>{e.preventDefault();setBlocking(false)}));

if(navigator.getGamepads){let padIndex=null,previousButtons=[],padDirs=new Set();const deadZone=.32,buttonActions={0:'interact',1:'attack',2:'weapon',3:'block',8:'vibe',9:'staff',17:'menu'},directionButtons={12:'ArrowUp',13:'ArrowDown',14:'ArrowLeft',15:'ArrowRight'};const gamepadStatus=document.createElement('div');gamepadStatus.style.cssText='position:fixed;left:12px;bottom:8px;z-index:30;padding:5px 8px;border:1px solid #8f7843;background:#07110de8;color:#c9b879;font-size:9px;letter-spacing:.12em;pointer-events:none';gamepadStatus.textContent='CONTROLLER · PRESS A BUTTON';document.body.appendChild(gamepadStatus);function setPadDirection(next){for(const key of padDirs)if(!next.has(key)){keys[key]=false;document.querySelector(`[data-key="${key}"]`)?.classList.remove('pressed')}for(const key of next)if(!padDirs.has(key)){keys[key]=true;document.querySelector(`[data-key="${key}"]`)?.classList.add('pressed')}padDirs=next}function releasePad(){setPadDirection(new Set());if(previousButtons[3])setBlocking(false);previousButtons=[]}function pollPad(){const pads=navigator.getGamepads(),pad=padIndex!==null?pads[padIndex]:Array.from(pads).find(Boolean);if(!pad){if(padIndex!==null)releasePad();padIndex=null;gamepadStatus.textContent='CONTROLLER · PRESS A BUTTON';requestAnimationFrame(pollPad);return}padIndex=pad.index;gamepadStatus.textContent=(/dualsense|wireless controller|054c/i.test(pad.id)?'DUALSENSE':'CONTROLLER')+' · CONNECTED';gamepadStatus.style.color='#e8c878';const next=new Set(),x=pad.axes[0]||0,y=pad.axes[1]||0;if(x<-deadZone||pad.buttons[14]?.pressed)next.add('ArrowLeft');if(x>deadZone||pad.buttons[15]?.pressed)next.add('ArrowRight');if(y<-deadZone||pad.buttons[12]?.pressed)next.add('ArrowUp');if(y>deadZone||pad.buttons[13]?.pressed)next.add('ArrowDown');setPadDirection(next);for(const indexText in buttonActions){const index=Number(indexText),pressed=!!pad.buttons[index]?.pressed,was=!!previousButtons[index],type=buttonActions[index];if(type==='block'){if(presse function loop(now){

region==='south'&&creepers.some(enemy=>enemy.alive&&Math.hypot(x-enemy.x,y-enemy.y)<40)||
