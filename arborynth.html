<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050310"><title>Prototype 08 · RP8</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050310;font-family:Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 35%,#19112b,#050310 64%);z-index:-1}
.back{position:fixed;right:4.5vw;top:max(18px,env(safe-area-inset-top));z-index:20;color:#c8bed1;text-decoration:none;border:1px solid #30243c;background:#090612;padding:15px 22px;font-size:12px;letter-spacing:.3em}
.device{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding-top:4vh}
.chassis{position:relative;width:min(100vw,calc(96vh * 768 / 1376));aspect-ratio:768/1376;overflow:hidden}
.chassis:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:url("assets/controller_frame.png") center/100% 100% no-repeat}
.screen{position:absolute;left:7.5521%;top:6.1047%;width:85.026%;height:50.5814%;z-index:1;overflow:hidden;background:#090615}
#rp8{width:100%;height:100%;border:0;display:block;background:#090615}
.hot{position:absolute;z-index:4;border:0;background:transparent;padding:0;touch-action:none;-webkit-tap-highlight-color:transparent;color:transparent}
.hot:active{background:rgba(232,200,120,.12)}
.up{left:14.71%;top:58.43%;width:11.72%;height:6.69%}.down{left:14.71%;top:71.22%;width:11.98%;height:6.69%}
.left{left:3.39%;top:64.24%;width:11.98%;height:7.85%}.right{left:26.17%;top:64.24%;width:11.98%;height:7.85%}
.x{left:69.92%;top:60.25%;width:15.36%;height:8.65%;border-radius:50%}.y{left:53.52%;top:68.02%;width:13.67%;height:6.47%;border-radius:50%}
.a{left:83.85%;top:68.02%;width:13.54%;height:7.12%;border-radius:50%}.b{left:68.36%;top:75.22%;width:13.54%;height:6.47%;border-radius:50%}
.menu{left:38.41%;top:86.48%;width:22.14%;height:11.26%}.start{left:66.15%;top:93.39%;width:22.79%;height:4%}.select{left:11.07%;top:93.39%;width:22.79%;height:4%}
#status{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:20;color:#776c83;font-size:9px;letter-spacing:.18em;text-transform:uppercase}
@media(max-width:600px){.device{padding-top:8vh}.back{top:12px;right:12px;padding:10px 14px;font-size:9px}}
</style>
</head>
<body>
<a class="back" href="games.html">← GAMES</a>
<div class="device"><div class="chassis">
  <div class="screen"><iframe id="rp8" src="rp8.html" title="Rizing Powers Prototype 8"></iframe></div>
  <button class="hot up" data-key="ArrowUp" aria-label="Move up"></button>
  <button class="hot down" data-key="ArrowDown" aria-label="Move down"></button>
  <button class="hot left" data-key="ArrowLeft" aria-label="Move left"></button>
  <button class="hot right" data-key="ArrowRight" aria-label="Move right"></button>
  <button class="hot x" data-tap="x" aria-label="Menu or cancel"></button>
  <button class="hot y" data-tap="Enter" aria-label="Confirm"></button>
  <button class="hot a" data-tap="z" aria-label="Interact"></button>
  <button class="hot b" data-key="Shift" aria-label="Run or back"></button>
  <button class="hot menu" data-tap="x" aria-label="Menu"></button>
  <button class="hot start" data-tap="F3" aria-label="Settings"></button>
  <button class="hot select" data-tap="F4" aria-label="Select"></button>
</div></div>
<div id="status">Expedition interface · RP8 viewport</div>
<script>
(()=>{
const frame=document.querySelector('#rp8'),held=new Map();
function target(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
function send(type,key){const doc=target();if(!doc)return;doc.dispatchEvent(new KeyboardEvent(type,{key,code:key.startsWith('Arrow')?key:key.length===1?'Key'+key.toUpperCase():key,bubbles:true,cancelable:true}))}
function press(key,id){if(!held.has(key))held.set(key,new Set());const s=held.get(key);if(!s.size)send('keydown',key);s.add(id)}
function release(key,id){const s=held.get(key);if(!s)return;s.delete(id);if(!s.size)send('keyup',key)}
document.querySelectorAll('[data-key]').forEach(el=>{const key=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);press(key,e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();release(key,e.pointerId)}))});
document.querySelectorAll('[data-tap]').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();const key=el.dataset.tap;send('keydown',key);setTimeout(()=>send('keyup',key),80)}));
frame.addEventListener('load',()=>{try{const d=target(),style=d.createElement('style');style.textContent=`
html,body{width:100%!important;height:100%!important;min-height:0!important;padding:0!important;overflow:hidden!important}
body{display:flex!important;align-items:center!important;justify-content:center!important}
.stage{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;aspect-ratio:auto!important;border:0!important;border-radius:0!important}
.mob-root,.menu-toggle,.stars{display:none!important}
`;d.head.appendChild(style);frame.contentWindow.focus()}catch(e){document.querySelector('#status').textContent='Tap the game screen once to activate controls'}});
})();
</script>
</body></html>
