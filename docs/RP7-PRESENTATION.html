<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIZING POWER 7 · AN AOV™ SAGA EXPERIENCE</title>
<!--
  ════════════════════════════════════════════════════════════════════════
  RIZING POWER 7 · INTERACTIVE PRESENTATION EXPERIENCE
  THE AOV™ SAGA

  HOW TO EDIT THIS FILE
  ─────────────────────
  Everything the Creator needs to change lives in ONE place: the PAGES
  array near the bottom of the <script>. Text, headlines, labels, button
  captions and diagram nodes are all plain data there — no HTML surgery.

  TO DROP IN REAL ARTWORK
  ───────────────────────
  Every image slot is written as:        slot('SHAPE', 'CAPTION')
  Give it a third argument — the path —  slot('SHAPE', 'CAPTION', 'art/x.png')
  …and the placeholder becomes the frame around your image. Nothing else
  changes. Shapes: hero · wide · portrait · screen · map · item · compare
  · cosmic · band.

  NOTHING IS LOADED FROM THE WEB. No fonts, no scripts, no images. Open
  the file and it runs.
  ════════════════════════════════════════════════════════════════════════
-->
<style>
/* ── PALETTE ─────────────────────────────────────────────────────────── */
:root{
  --void:#03050c; --black:#06090f; --navy:#0a1430; --navy-2:#0d1b3d;
  --cyan:#5fd8ff; --cyan-dim:#2a7f9e; --blue:#3f7dff; --cosmic:#8a6cff;
  --gold:#d9a441; --gold-lt:#ffe6a8; --white:#f2f7ff; --muted:#8aa4c4;
  --muted-2:#4c6384; --danger:#ff5b5b; --ok:#5fdc7a;
  --line:rgba(95,216,255,.26); --line-soft:rgba(95,216,255,.12);
  --ui: ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  --disp: 'Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--void); color:var(--white);
  font-family:var(--disp); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* the field the whole experience sits on · starfield + astral haze */
#field{position:fixed;inset:0;z-index:0;background:
  radial-gradient(1200px 700px at 72% 18%, rgba(63,125,255,.13), transparent 62%),
  radial-gradient(900px 600px at 18% 82%, rgba(138,108,255,.11), transparent 60%),
  radial-gradient(1400px 900px at 50% 50%, rgba(10,20,48,.9), var(--void) 70%);}
#stars{position:fixed;inset:0;z-index:0;opacity:.55}
/* a faint scan texture · the Zyphone's own plate, dialled right down */
#plate{position:fixed;inset:0;z-index:40;pointer-events:none;mix-blend-mode:screen;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(95,216,255,.045) 0 1px,transparent 1px 3px);}
#vig{position:fixed;inset:0;z-index:41;pointer-events:none;
  background:radial-gradient(130% 100% at 50% 50%,transparent 52%,rgba(0,0,0,.72) 100%)}

/* ── CHROME ──────────────────────────────────────────────────────────── */
#chrome{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;flex-direction:column}
#topbar{display:flex;align-items:center;gap:14px;padding:14px 26px;
  border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(6,10,22,.92),rgba(6,10,22,.35));
  backdrop-filter:blur(6px);pointer-events:auto}
.mark{display:flex;align-items:center;gap:9px;cursor:pointer;flex:0 0 auto}
.mark:hover .mark-g{color:var(--gold-lt)}
.mark-g{color:var(--gold);font-size:15px;transition:color .2s}
.mark-t{font:700 11px/1 var(--ui);letter-spacing:.22em;color:var(--cyan)}
.mark-s{font:400 8px/1 var(--ui);letter-spacing:.18em;color:var(--muted-2);margin-top:3px}
#crumb{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
#crumb-ch{font:700 10px/1 var(--ui);letter-spacing:.2em;color:var(--gold)}
#crumb-sep{color:var(--muted-2);font-size:10px}
#crumb-pg{font:400 10px/1 var(--ui);letter-spacing:.14em;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topright{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.btn{font:700 9px/1 var(--ui);letter-spacing:.16em;color:var(--cyan);
  background:rgba(95,216,255,.07);border:1px solid var(--line);padding:8px 13px;
  cursor:pointer;transition:all .18s;white-space:nowrap}
.btn:hover{background:rgba(95,216,255,.18);color:#fff;border-color:var(--cyan)}
.btn:active{transform:translateY(1px)}
.btn.gold{color:var(--gold);border-color:rgba(217,164,65,.45);background:rgba(217,164,65,.08)}
.btn.gold:hover{background:rgba(217,164,65,.2);color:var(--gold-lt);border-color:var(--gold)}
.btn[disabled]{opacity:.28;cursor:default;pointer-events:none}
#botbar{margin-top:auto;display:flex;align-items:center;gap:14px;padding:12px 26px;
  border-top:1px solid var(--line-soft);
  background:linear-gradient(0deg,rgba(6,10,22,.92),rgba(6,10,22,.3));
  backdrop-filter:blur(6px);pointer-events:auto}
#prog{flex:1;height:2px;background:rgba(95,216,255,.12);position:relative;overflow:hidden}
#prog i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--cyan),var(--blue));
  width:0;transition:width .5s cubic-bezier(.3,.8,.3,1)}
#pgno{font:700 10px/1 var(--ui);letter-spacing:.16em;color:var(--muted);flex:0 0 auto;min-width:62px;text-align:right}

/* ── STAGE ───────────────────────────────────────────────────────────── */
#stage{position:fixed;inset:58px 0 50px;z-index:20;overflow-y:auto;overflow-x:hidden;
  scroll-behavior:smooth}
#stage::-webkit-scrollbar{width:7px}
#stage::-webkit-scrollbar-thumb{background:rgba(95,216,255,.22)}
.page{min-height:100%;padding:44px 56px 56px;max-width:1500px;margin:0 auto;
  display:flex;flex-direction:column}
.page.center{justify-content:center;align-items:center;text-align:center}

/* ── TYPE ────────────────────────────────────────────────────────────── */
.eyebrow{font:700 10px/1 var(--ui);letter-spacing:.34em;color:var(--cyan-dim);margin-bottom:16px;
  display:flex;align-items:center;gap:11px}
.eyebrow::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.page.center .eyebrow::after{display:none}
h1{font:200 clamp(38px,5.6vw,78px)/1.02 var(--disp);letter-spacing:-.022em;margin:0 0 18px;
  color:#fff;text-shadow:0 0 56px rgba(95,216,255,.26)}
h1 b{font-weight:700}
h2{font:300 clamp(26px,3.1vw,42px)/1.12 var(--disp);letter-spacing:-.012em;margin:0 0 14px;color:#fff}
h3{font:700 11px/1 var(--ui);letter-spacing:.24em;color:var(--gold);margin:0 0 12px}
.lede{font:300 clamp(15px,1.5vw,20px)/1.66 var(--disp);color:#c9dcf2;max-width:66ch;margin:0 0 22px}
.sub{font:400 12px/1.7 var(--ui);letter-spacing:.07em;color:var(--muted);max-width:72ch}
.quiet{color:var(--muted-2);font:400 10px/1.6 var(--ui);letter-spacing:.1em}
.gold{color:var(--gold)} .cy{color:var(--cyan)} .wh{color:#fff}
.q{font:200 clamp(22px,2.7vw,38px)/1.3 var(--disp);color:#fff;letter-spacing:-.01em}

/* ── LAYOUT HELPERS ──────────────────────────────────────────────────── */
.row{display:flex;gap:30px;align-items:flex-start}
.row.top{align-items:flex-start}
.col{flex:1;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.wrap{display:flex;flex-wrap:wrap;gap:9px}
.spacer{flex:1}
@media (max-width:1000px){
  .row{flex-direction:column} .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .page{padding:30px 24px 44px}
}

/* ── CHIPS / TAGS ────────────────────────────────────────────────────── */
.chip{font:700 9px/1 var(--ui);letter-spacing:.16em;color:var(--cyan);
  border:1px solid var(--line);background:rgba(95,216,255,.06);padding:8px 12px}
.chip.g{color:var(--gold);border-color:rgba(217,164,65,.4);background:rgba(217,164,65,.07)}
.chip.d{color:var(--danger);border-color:rgba(255,91,91,.4);background:rgba(255,91,91,.07)}
.chip.p{color:var(--cosmic);border-color:rgba(138,108,255,.4);background:rgba(138,108,255,.08)}

/* ── PANEL ───────────────────────────────────────────────────────────── */
.panel{border:1px solid var(--line-soft);background:linear-gradient(160deg,rgba(13,27,61,.6),rgba(6,9,15,.72));
  padding:20px 22px;position:relative}
.panel::before{content:'';position:absolute;top:-1px;left:-1px;width:12px;height:12px;
  border-top:1px solid var(--cyan);border-left:1px solid var(--cyan);opacity:.6}
.panel::after{content:'';position:absolute;bottom:-1px;right:-1px;width:12px;height:12px;
  border-bottom:1px solid var(--cyan);border-right:1px solid var(--cyan);opacity:.6}
.panel.g::before,.panel.g::after{border-color:var(--gold)}
.panel h4{font:700 10px/1 var(--ui);letter-spacing:.2em;color:var(--cyan);margin:0 0 10px}
.panel p{font:400 12px/1.72 var(--ui);letter-spacing:.04em;color:#b8cde6;margin:0}

/* ── IMAGE SLOT · the Creator's asset frame ──────────────────────────── */
.slot{position:relative;border:1px solid rgba(95,216,255,.3);
  background:
    linear-gradient(135deg,rgba(95,216,255,.045) 0%,transparent 42%),
    repeating-linear-gradient(45deg,rgba(95,216,255,.028) 0 12px,transparent 12px 24px),
    linear-gradient(160deg,rgba(13,27,61,.55),rgba(3,5,12,.8));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:9px;overflow:hidden;transition:border-color .25s}
.slot:hover{border-color:rgba(95,216,255,.55)}
.slot .cnr{position:absolute;width:14px;height:14px;border:1px solid var(--cyan);opacity:.75}
.slot .c1{top:7px;left:7px;border-right:0;border-bottom:0}
.slot .c2{top:7px;right:7px;border-left:0;border-bottom:0}
.slot .c3{bottom:7px;left:7px;border-right:0;border-top:0}
.slot .c4{bottom:7px;right:7px;border-left:0;border-top:0}
.slot .pend{font:700 8px/1 var(--ui);letter-spacing:.26em;color:var(--cyan-dim)}
.slot .big{font:700 11px/1.5 var(--ui);letter-spacing:.2em;color:rgba(95,216,255,.62);text-align:center}
.slot .cap{font:700 9px/1.4 var(--ui);letter-spacing:.17em;color:var(--gold);text-align:center;
  padding:0 16px;max-width:92%}
.slot .dim{font:400 8px/1 var(--ui);letter-spacing:.16em;color:var(--muted-2)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.filled{border-color:rgba(217,164,65,.5)}
.slot.hero{aspect-ratio:21/9;width:100%}
.slot.wide{aspect-ratio:16/7;width:100%}
.slot.screen{aspect-ratio:16/9;width:100%}
.slot.portrait{aspect-ratio:3/4;width:100%}
.slot.map{aspect-ratio:4/3;width:100%}
.slot.item{aspect-ratio:1/1;width:100%}
.slot.cosmic{aspect-ratio:1/1;width:100%;border-radius:50%}
.slot.compare{aspect-ratio:4/3;width:100%}
.slot.band{aspect-ratio:32/9;width:100%}

/* ── DIAGRAM · flow nodes ────────────────────────────────────────────── */
.flow{display:flex;flex-direction:column;gap:0;align-items:stretch}
.flow.h{flex-direction:row;align-items:center;flex-wrap:wrap;gap:0}
.node{border:1px solid var(--line);background:rgba(10,20,48,.6);
  padding:13px 18px;font:700 10px/1 var(--ui);letter-spacing:.17em;color:var(--white);
  text-align:center;position:relative;opacity:0;transform:translateY(8px);
  animation:nodeIn .5s forwards}
.node.k{color:var(--gold);border-color:rgba(217,164,65,.45);background:rgba(217,164,65,.07)}
.node.c{color:var(--cyan);border-color:var(--line);background:rgba(95,216,255,.07)}
.node.d{color:var(--danger);border-color:rgba(255,91,91,.4);background:rgba(255,91,91,.07)}
.arr{align-self:center;color:var(--cyan-dim);font-size:15px;line-height:1;padding:7px 0;
  opacity:0;animation:nodeIn .4s forwards}
.flow.h .arr{padding:0 13px}
@keyframes nodeIn{to{opacity:1;transform:none}}
.loop{align-self:center;color:var(--cyan);font:700 14px/1 var(--ui);padding:9px 0;
  opacity:0;animation:nodeIn .4s forwards}

/* ── LIST ROWS ───────────────────────────────────────────────────────── */
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line-soft)}
.rw{display:flex;align-items:center;gap:16px;padding:12px 4px;border-bottom:1px solid var(--line-soft);
  font:400 11px/1.4 var(--ui);letter-spacing:.07em;color:#b8cde6}
.rw .n{color:var(--cyan-dim);font-weight:700;min-width:28px}
.rw .a{color:#fff;font-weight:700;letter-spacing:.14em;min-width:140px}
.rw .b{color:var(--gold);min-width:110px}
.rw .c{color:var(--muted)}

/* ── BOOT ────────────────────────────────────────────────────────────── */
#boot{position:fixed;inset:0;z-index:90;background:var(--void);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  transition:opacity .9s ease,visibility .9s}
#boot.gone{opacity:0;visibility:hidden}
#boot .bg{position:absolute;inset:0;opacity:.3}
#boot .inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  text-align:center;padding:0 24px;width:100%;max-width:780px}
.boot-l{font:700 10px/1 var(--ui);letter-spacing:.42em;color:var(--gold);opacity:0;margin-bottom:26px}
.boot-h{font:200 clamp(42px,8vw,104px)/1 var(--disp);letter-spacing:-.03em;color:#fff;opacity:0;
  text-shadow:0 0 70px rgba(95,216,255,.34);margin-bottom:10px}
.boot-h b{font-weight:700}
.boot-s{font:700 10px/1 var(--ui);letter-spacing:.34em;color:var(--cyan);opacity:0;margin-bottom:40px}
.boot-log{font:400 9px/2 var(--ui);letter-spacing:.17em;color:var(--cyan-dim);opacity:0;
  min-height:88px;text-align:left;width:100%;max-width:430px}
.boot-log span{display:block}
#enterBtn{opacity:0;font:700 11px/1 var(--ui);letter-spacing:.28em;color:var(--gold-lt);
  background:rgba(217,164,65,.1);border:1px solid var(--gold);padding:17px 44px;cursor:pointer;
  transition:all .25s;margin-top:10px}
#enterBtn:hover{background:rgba(217,164,65,.26);box-shadow:0 0 44px rgba(217,164,65,.34)}
.fin{animation:fade .7s forwards}
@keyframes fade{to{opacity:1}}

/* ── HUB ─────────────────────────────────────────────────────────────── */
.hub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;width:100%;max-width:1080px}
@media (max-width:860px){.hub-grid{grid-template-columns:repeat(2,1fr)}}
.hubc{border:1px solid var(--line-soft);background:linear-gradient(160deg,rgba(13,27,61,.5),rgba(6,9,15,.65));
  padding:20px 18px;cursor:pointer;text-align:left;transition:all .25s;position:relative;overflow:hidden}
.hubc::after{content:'';position:absolute;inset:0;background:linear-gradient(140deg,rgba(95,216,255,.1),transparent 55%);
  opacity:0;transition:opacity .25s}
.hubc:hover{border-color:var(--cyan);transform:translateY(-3px)}
.hubc:hover::after{opacity:1}
.hubc .k{font:700 9px/1 var(--ui);letter-spacing:.2em;color:var(--cyan-dim);margin-bottom:9px}
.hubc .t{font:300 21px/1.1 var(--disp);color:#fff;letter-spacing:-.01em;margin-bottom:6px;position:relative;z-index:2}
.hubc .d{font:400 9px/1.6 var(--ui);letter-spacing:.09em;color:var(--muted);position:relative;z-index:2}

/* ── DISTRICT MAP ────────────────────────────────────────────────────── */
.dmap{position:relative;width:100%;aspect-ratio:4/3;border:1px solid var(--line-soft);
  background:radial-gradient(circle at 50% 50%,rgba(13,27,61,.65),rgba(3,5,12,.85))}
.dnode{position:absolute;transform:translate(-50%,-50%);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .22s}
.dnode .dot{width:15px;height:15px;border:1px solid var(--cyan);background:rgba(10,20,48,.9);
  transform:rotate(45deg);transition:all .22s}
.dnode .lbl{font:700 8px/1 var(--ui);letter-spacing:.14em;color:var(--muted);white-space:nowrap;transition:color .22s}
.dnode:hover .dot,.dnode.on .dot{background:var(--cyan);box-shadow:0 0 18px var(--cyan);transform:rotate(45deg) scale(1.22)}
.dnode:hover .lbl,.dnode.on .lbl{color:#fff}
.dnode.on .dot{border-color:var(--gold);background:var(--gold);box-shadow:0 0 22px var(--gold)}
.dlink{position:absolute;inset:0;pointer-events:none}

/* ── WORLD GRID (astragraphy) ────────────────────────────────────────── */
.wgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:7px}
@media (max-width:1100px){.wgrid{grid-template-columns:repeat(5,1fr)}}
.wnode{aspect-ratio:1;border:1px solid var(--line-soft);background:rgba(10,20,48,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;transition:all .2s;position:relative}
.wnode:hover{border-color:var(--cyan);background:rgba(95,216,255,.1);transform:scale(1.07)}
.wnode.on{border-color:var(--gold);background:rgba(217,164,65,.14);box-shadow:0 0 22px rgba(217,164,65,.26)}
.wnode .wn{font:700 8px/1 var(--ui);color:var(--cyan-dim)}
.wnode .wl{font:700 7px/1 var(--ui);letter-spacing:.08em;color:var(--muted);text-align:center;padding:0 2px}
.wnode.on .wl,.wnode:hover .wl{color:#fff}
.wnode.drift{border-color:rgba(138,108,255,.5);background:rgba(138,108,255,.1)}
.wnode.drift .wn,.wnode.drift .wl{color:var(--cosmic)}

/* ── REMEMORY ────────────────────────────────────────────────────────── */
.rem{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
@media (max-width:900px){.rem{grid-template-columns:repeat(2,1fr)}}
.rstep{border:1px solid var(--line-soft);background:rgba(10,20,48,.5);padding:18px 16px;
  cursor:pointer;transition:all .25s;position:relative;overflow:hidden;min-height:150px}
.rstep.on{border-color:var(--cosmic);background:rgba(138,108,255,.11);box-shadow:0 0 28px rgba(138,108,255,.2)}
.rstep .rn{font:700 9px/1 var(--ui);letter-spacing:.2em;color:var(--cosmic);margin-bottom:9px}
.rstep .rt{font:300 19px/1.1 var(--disp);color:#fff;margin-bottom:9px}
.rstep .rd{font:400 9px/1.65 var(--ui);letter-spacing:.07em;color:var(--muted)}
.rviz{height:4px;background:rgba(138,108,255,.16);margin-top:13px;position:relative;overflow:hidden}
.rviz i{position:absolute;inset:0 auto 0 0;width:0;background:var(--cosmic);transition:width .55s}
.rstep.on .rviz i{width:100%}

/* ── MODES ───────────────────────────────────────────────────────────── */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
@media (max-width:1000px){.modes{grid-template-columns:1fr}}
.mode{border:1px solid var(--line-soft);background:linear-gradient(170deg,rgba(13,27,61,.55),rgba(6,9,15,.7));
  padding:0;overflow:hidden;transition:all .25s;cursor:pointer}
.mode:hover{border-color:var(--cyan);transform:translateY(-4px)}
.mode .mh{padding:18px 20px;border-bottom:1px solid var(--line-soft)}
.mode .mt{font:300 24px/1.05 var(--disp);color:#fff;margin-bottom:6px}
.mode .mk{font:700 9px/1 var(--ui);letter-spacing:.2em;color:var(--gold)}
.mode .mb{padding:16px 20px 20px}

/* ── SEER CORRUPTION · used only where the story earns it ────────────── */
.corrupt{animation:corrupt 5.5s infinite}
@keyframes corrupt{
  0%,96%,100%{filter:none;transform:none}
  97%{filter:hue-rotate(-14deg) saturate(1.5);transform:translateX(1px)}
  98%{filter:none;transform:translateX(-1px)}
  99%{filter:hue-rotate(10deg);transform:none}}
.seerline{border-left:2px solid var(--danger);padding-left:15px}

/* ── TOASTS ──────────────────────────────────────────────────────────── */
#toasts{position:fixed;right:26px;bottom:66px;z-index:60;display:flex;flex-direction:column;
  gap:7px;align-items:flex-end;pointer-events:none}
.toast{font:700 9px/1 var(--ui);letter-spacing:.17em;color:var(--cyan);
  border:1px solid var(--line);background:rgba(6,14,32,.94);padding:10px 15px;
  display:flex;align-items:center;gap:9px;animation:tIn .4s forwards, tOut .5s 3.6s forwards}
.toast.g{color:var(--gold);border-color:rgba(217,164,65,.45)}
.toast.d{color:var(--danger);border-color:rgba(255,91,91,.45)}
@keyframes tIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateX(26px)}}

/* ── CHAPTER MENU ────────────────────────────────────────────────────── */
#chmenu{position:fixed;inset:0;z-index:70;background:rgba(3,5,12,.95);backdrop-filter:blur(9px);
  display:none;align-items:center;justify-content:center;padding:40px}
#chmenu.on{display:flex}
#chmenu .box{width:100%;max-width:900px}
#chmenu .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.chlist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:800px){.chlist{grid-template-columns:repeat(2,1fr)}}
.chi{border:1px solid var(--line-soft);background:rgba(10,20,48,.5);padding:15px 16px;cursor:pointer;
  transition:all .2s;text-align:left}

/* ═══════════════════════════════════════════════════════════════════════
   STARFIELD · the only generated visual in the build. It is not artwork —
   it is the field the interface sits on, and it stays out of every slot
   the Creator owns.
   ═══════════════════════════════════════════════════════════════════════ */
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');let S=[];
  function size(){c.width=innerWidth;c.height=innerHeight;S=[];
    const n=Math.round(innerWidth*innerHeight/9000);
    for(let i=0;i<n;i++)S.push({x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*1.25+.18,a:Math.random()*.6+.14,s:Math.random()*.0016+.0003});}
  function draw(t){x.clearRect(0,0,c.width,c.height);
    for(const s of S){const a=s.a*(.62+.38*Math.sin(t*s.s+s.x));
      x.fillStyle='rgba(150,205,255,'+a.toFixed(3)+')';
      x.fillRect(s.x,s.y,s.r,s.r);}
    requestAnimationFrame(draw);}
  addEventListener('resize',size);size();requestAnimationFrame(draw);
})();

/* ═══════════════════════════════════════════════════════════════════════
   IMAGE SLOT
   slot(shape, caption)            → placeholder
   slot(shape, caption, 'art.png') → the Creator's image, same frame
   ═══════════════════════════════════════════════════════════════════════ */
const SHAPE_HINT={hero:'21:9 CINEMATIC',wide:'16:7 CINEMATIC',screen:'16:9 SCREENSHOT',
  portrait:'3:4 CHARACTER',map:'4:3 MAP CANVAS',item:'1:1 ASSET',cosmic:'1:1 PLANETARY',
  compare:'4:3 COMPARISON',band:'32:9 BANNER'};
function slot(shape,cap,src){
  if(src) return `<div class="slot filled ${shape}"><img src="${src}" alt="${cap}"></div>`;
  return `<div class="slot ${shape}">
    <i class="cnr c1"></i><i class="cnr c2"></i><i class="cnr c3"></i><i class="cnr c4"></i>
    <div class="pend">VISUAL DATA PENDING</div>
    <div class="big">CUSTOM RP7 IMAGE<br>[ CREATOR ASSET SLOT ]</div>
    <div class="cap">${cap}</div>
    <div class="dim">${SHAPE_HINT[shape]||''}</div>
  </div>`;
}
/* flow diagram · nodes animate in sequence so the ORDER is the information */
function flow(items,opts){
  const o=opts||{},cls=o.h?'flow h':'flow';let h=`<div class="${cls}">`,d=0;
  items.forEach((it,i)=>{
    const t=typeof it==='string'?it:it.t, k=typeof it==='string'?'':(it.k||'');
    if(i){h+=`<div class="arr" style="animation-delay:${d}s">${o.h?'→':'↓'}</div>`;d+=.09;}
    h+=`<div class="node ${k}" style="animation-delay:${d}s">${t}</div>`;d+=.11;
  });
  if(o.loop)h+=`<div class="loop" style="animation-delay:${d}s">↺</div>`;
  return h+'</div>';
}
function toast(msg,kind){
  const t=document.createElement('div');t.className='toast '+(kind||'');
  t.innerHTML=`<span>◈</span><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(),4300);
}

/* ═══════════════════════════════════════════════════════════════════════
   ENGINE · linear path and interactive path, both always live (§50)
   ═══════════════════════════════════════════════════════════════════════ */
let cur=0, remStep=0;
const stage=document.getElementById('stage');

function render(){
  const p=PAGES[cur];
  stage.innerHTML=p.body();
  stage.firstElementChild.classList.add(p.t||'t-data');
  stage.scrollTop=0;
  document.getElementById('crumb-ch').textContent=p.hub?'':p.ch;
  document.getElementById('crumb-sep').style.opacity=p.hub?0:1;
  document.getElementById('crumb-pg').textContent=p.title;
  document.getElementById('pgno').textContent=p.hub?'HUB':String(cur).padStart(2,'0')+' / '+String(PAGES.length-1).padStart(2,'0');
  document.getElementById('prog').firstElementChild.style.width=(cur/(PAGES.length-1)*100)+'%';
  document.getElementById('backBtn').disabled=(cur===0);
  const nb=document.getElementById('nextBtn');
  nb.disabled=(cur===PAGES.length-1);
  nb.textContent=(cur===0?'BEGIN ›':'NEXT ›');
  if(p.onEnter)setTimeout(p.onEnter,560);
}
function go(i){ cur=Math.max(0,Math.min(PAGES.length-1,i)); render(); }
function next(){ if(cur<PAGES.length-1)go(cur+1); }
function prev(){ if(cur>0)go(cur-1); }
function goHub(){ go(0); closeCh(); }
function goCh(ch){ const i=PAGES.findIndex(p=>p.ch===ch); if(i>=0)go(i); closeCh(); }

/* chapter menu */
const CHAPTERS=['WORLD','RIZER','ZYREX','STORY','GAMEPLAY','TECHNOLOGY','ASTRAGRAPHY','MODES','RP7D'];
document.getElementById('chlist').innerHTML=CHAPTERS.map(c=>{
  const n=PAGES.filter(p=>p.ch===c).length;
  return `<div class="chi" onclick="goCh('${c}')"><div class="ck">▸ ${n} PAGE${n>1?'S':''}</div>
    <div class="ct">${c==='RP7D'?'RP7 DELUXE':c.charAt(0)+c.slice(1).toLowerCase()}</div></div>`;
}).join('');
function toggleCh(){ document.getElementById('chmenu').classList.toggle('on'); }
function closeCh(){ document.getElementById('chmenu').classList.remove('on'); }

/* keyboard · the deck must work from a clicker or a keyboard with no mouse */
addEventListener('keydown',e=>{
  if(document.getElementById('boot').classList.contains('gone')===false)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Escape'){closeCh();goHub();}
  else if(e.key==='c'||e.key==='C'){toggleCh();}
  else if(e.key==='Home'){go(1);}
  else if(e.key==='End'){go(PAGES.length-1);}
});

/* ── INTERACTIONS ────────────────────────────────────────────────────── */
function pickD(i){
  const d=DISTRICTS[i];
  DISTRICTS.forEach((_,j)=>{const n=document.getElementById('dn'+j); if(n)n.classList.toggle('on',i===j);});
  const p=document.getElementById('dpanel');
  if(p)p.innerHTML=`<h4>DISTRICT ${d.n}</h4>
    <div style="font:300 34px/1 var(--disp);color:#fff;margin:8px 0 16px">${d.id}</div>
    <div class="kv"><span class="k">GEMLORD</span><span class="v wh">${d.g}</span></div>
    <div class="kv"><span class="k">IDENTITY</span><span class="v">${d.l}</span></div>
    <button class="btn" style="margin-top:18px" onclick="clearD()">‹ BACK TO ZYRAXIS</button>`;
  toast('DISTRICT '+d.n+' · '+d.id);
}
function clearD(){
  DISTRICTS.forEach((_,j)=>{const n=document.getElementById('dn'+j); if(n)n.classList.remove('on');});
  const p=document.getElementById('dpanel');
  if(p)p.innerHTML=`<h4>DISTRICT DATABASE</h4><p class="quiet">Select a district node to read its entry.</p>`;
}
function pickW(i){
  WORLDS.forEach((_,j)=>{const n=document.getElementById('wn'+j); if(n)n.classList.remove('on');});
  const dn=document.getElementById('wnD'); if(dn)dn.classList.remove('on');
  const name = i<0?'OVAURON':WORLDS[i];
  const num  = i<0?'AEP-28':String(i+1).padStart(2,'0');
  const el   = i<0?dn:document.getElementById('wn'+i);
  if(el)el.classList.add('on');
  const s=document.getElementById('wslot');
  if(s)s.innerHTML=slot('cosmic',name+' · PLANETARY VISUAL');
  const p=document.getElementById('wpanel');
  if(p)p.innerHTML=`<h4>WORLD RECORD</h4>
    <div style="font:300 30px/1 var(--disp);color:#fff;margin:8px 0 14px">${name}</div>
    <div class="kv"><span class="k">NUMBER</span><span class="v wh">${num}</span></div>
    <div class="kv"><span class="k">QUADRANT</span><span class="v quiet">— CREATOR DATA PENDING —</span></div>
    <div class="kv"><span class="k">OBSERVATION</span><span class="v quiet">— CREATOR DATA PENDING —</span></div>
    ${i<0?'<div class="note" style="margin-top:14px;border-color:var(--cosmic)">DRIFT WORLD · outside the ordered sequence.</div>':''}
    <button class="btn" style="margin-top:16px" onclick="clearW()">‹ RETURN TO EXPANSE</button>`;
  toast('ASTRAGRAPHY · '+name,'g');
}
function clearW(){
  WORLDS.forEach((_,j)=>{const n=document.getElementById('wn'+j); if(n)n.classList.remove('on');});
  const dn=document.getElementById('wnD'); if(dn)dn.classList.remove('on');
  const s=document.getElementById('wslot'); if(s)s.innerHTML=slot('cosmic','SELECTED PLANET');
  const p=document.getElementById('wpanel');
  if(p)p.innerHTML=`<h4>WORLD RECORD</h4><p class="quiet">Select a world to inspect it.</p>`;
}
function remAt(i){
  remStep=i;
  for(let j=0;j<4;j++){const e=document.getElementById('rs'+j); if(e)e.classList.toggle('on',j<=i);}
}

/* ── BOOT SEQUENCE ───────────────────────────────────────────────────── */
(function(){
  const L=['AOV™ SAGA CORE ................ ONLINE',
           'ZYRAXIS GEOGRAPHY ............. LOADED',
           'ASTRALITE LATTICE ............. STABLE',
           'ZYREX DATABASE ................ 67 SPECIES',
           'SEER ACTIVITY ................. MONITORED'];
  const log=document.getElementById('b4');
  setTimeout(()=>document.getElementById('b1').classList.add('fin'),300);
  setTimeout(()=>document.getElementById('b2').classList.add('fin'),1000);
  setTimeout(()=>document.getElementById('b3').classList.add('fin'),1750);
  setTimeout(()=>{log.classList.add('fin');
    L.forEach((l,i)=>setTimeout(()=>{
      const s=document.createElement('span');s.textContent='> '+l;log.appendChild(s);
      if(i===L.length-1)setTimeout(()=>document.getElementById('enterBtn').classList.add('fin'),400);
    },i*260));},2300);
})();
document.getElementById('enterBtn').onclick=()=>{
  document.getElementById('boot').classList.add('gone');
  render();
  setTimeout(()=>toast('WELCOME TO ZYRAXIS','g'),900);
};
render();
</script>
</body>
