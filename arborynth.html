<div class="screen"><div id="world"><canvas class="worldArt" id="tileMap" width="1024" height="1024"></canvas><img id="playerHome" src="assets/arboryth assets/house/house_arborynth_player_base.png" alt=""><div id="homeLabel">PLAYER HOME</div><div id="interiorDoor">EXIT</div><img id="groundStaff" src="assets/arboryth assets/item/item_aura_staff_ground.png" alt=""><img id="groundHands" src="assets/arboryth assets/item/item_hands_of_thorne.png" alt="Hands of Thorne"></div><div id="pulse"></div><canvas id="player" width="314" height="314" role="img" aria-label="Arborynth traveler"></canvas><div id="staffAttack" aria-hidden="true"></div><div id="prompt"></div><div id="healthHud" aria-label="Player health">♥♥♥♥♥</div><div id="location">FOREST OF THE GODVINE · 32 × 32</div><button id="weaponWheel" type="button" aria-label="Cycle equipped weapon"><span class="wheelKey">↻</span><img class="weaponIcon staffIcon" src="assets/arboryth assets/item/item_aura_staff_ground.png" alt=""><img class="weaponIcon handsIcon" src="assets/arboryth assets/item/item_hands_of_thorne.png" alt=""><span class="weaponNone">NONE</span></button><div id="death">VIBE EXTINGUISHED<small>PRESS START TO RETURN HOME</small></div></div>
<div class="hud"><div class="power">VIBE <span id="vibeLv">LV 1</span><div class="meter"><i id="vibeBar"></i></div></div><div class="power">AURA STAFF <span id="staffLv">LV 1</span><div class="meter"><i id="staffBar"></i></div></div></div>

<script>
(()=>{const world=document.querySelector('#world'),tileMap=document.querySelector('#tileMap'),player=document.querySelector('#player'),playerCtx=player.getContext('2d'),playerHome=document.querySelector('#playerHome'),homeLabel=document.querySelector('#homeLabel'),interiorDoor=document.querySelector('#interiorDoor'),locationLabel=document.querySelector('#location'),groundStaff=document.querySelector('#groundStaff'),groundHands=document.querySelector('#groundHands'),prompt=document.querySelector('#prompt'),staffAttack=document.querySelector('#staffAttack'),weaponWheel=document.querySelector('#weaponWheel'),healthHud=document.querySelector('#healthHud'),deathScreen=document.querySelector('#death'),screen=document.querySelector('.screen'),keys={},bounds={w:1024,h:1024},staffPos={x:620,y:640},handsPos={x:385,y:705},houseDoorPos={x:760,y:430},interiorExitPos={x:384,y:710},homeBlock={x:670,y:205,w:220,h:175};let scene='outdoor',cam={x:512,y:650},last=performance.now(),distance=0,step=0,attacking=false,blocking=false,playerDead=false,playerHp=5,invulnerableUntil=0,facing='down',messageTimer,currentWalkImage;const attackSheets={down:'assets/arboryth assets/animations/animation_arborynth_staff_attack.png',up:'assets/arboryth assets/animations/animation_arborynth_staff_attack_up.png',left:'assets/arboryth assets/animations/animation_arborynth_staff_attack_left.png',right:'assets/arboryth assets/animations/animation_arborynth_staff_attack_right.png'},walkImages={none:new Image(),staff:new Image(),hands:new Image()},creeperImages={idle:new Image(),walk:new Image(),attack:new Image()};walkImages.none.src='assets/arboryth assets/animations/animation_arborynth_walk.png';walkImages.staff.src='assets/arboryth assets/animations/animation_arborynth_walk_staff.png';walkImages.hands.src='assets/arboryth assets/animations/animation_arborynth_walk_hands_game.png';creeperImages.idle.src='assets/arboryth assets/verdant-creeper/verdant-creeper-idle-game.png';creeperImages.walk.src='assets/arboryth assets/verdant-creeper/verdant-creeper-walk-game.png';creeperImages.attack.src='assets/arboryth assets/verdant-creeper/verdant-creeper-attack-game.png';playerCtx.imageSmoothingEnabled=false;const progress=JSON.parse(localStorage.getItem('arborynthProgress')||'{"vibe":{"level":1,"xp":0},"staff":{"level":1,"xp":0}}');progress.hasStaff=!!progress.hasStaff;progress.hasHands=!!progress.hasHands;if(!['none','staff','hands'].includes(progress.equipped)||progress.equipped==='staff'&&!progress.hasStaff||progress.equipped==='hands'&&!progress.hasHands)progress.equipped=progress.hasStaff?'staff':progress.hasHands?'hands':'none';
const floorTexture=new Image(),homeFloorTexture=new Image();floorTexture.src='assets/arboryth assets/tile/tile_arborynth_floor.png';homeFloorTexture.src='assets/arboryth assets/tile/tile_arborynth_home_floor.png';function drawTileMap(image,count,tileSize=32){if(!image.complete||!image.naturalWidth)return;const size=count*tileSize;tileMap.width=size;tileMap.height=size;world.style.width=`${size}px`;world.style.height=`${size}px`;const c=tileMap.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,size,size);for(let ty=0;ty<count;ty++)for(let tx=0;tx<count;tx++){const sx=((tx*7+ty*3)%9)*128,sy=((tx*5+ty*8)%9)*128;c.drawImage(image,sx,sy,128,128,tx*tileSize,ty*tileSize,tileSize,tileSize)}}floorTexture.onload=()=>scene==='outdoor'&&drawTileMap(floorTexture,32);homeFloorTexture.onload=()=>scene==='indoor'&&drawTileMap(homeFloorTexture,16,48);
function render(){for(const t of ['vibe','staff']){const p=progress[t];document.querySelector(`#${t}Lv`).textContent=`LV ${p.level}`;document.querySelector(`#${t}Bar`).style.width=`${p.xp/(p.level*100)*100}%`}}function gain(t,n){const p=progress[t];p.xp+=n;while(p.xp>=p.level*100){p.xp-=p.level*100;p.level++}localStorage.setItem('arborynthProgress',JSON.stringify(progress));render()}
function showMessage(text){clearTimeout(messageTimer);prompt.textContent=text;prompt.classList.add('show');messageTimer=setTimeout(()=>{prompt.classList.remove('show');messageTimer=null},1500)}
function drawPlayerFrame(frame=0){if(!currentWalkImage?.complete||!currentWalkImage.naturalWidth)return;const rows={up:0,left:1,right:2,down:3},sw=currentWalkImage.naturalWidth/4,sh=currentWalkImage.naturalHeight/4;playerCtx.clearRect(0,0,player.width,player.height);playerCtx.drawImage(currentWalkImage,frame*sw,rows[facing]*sh,sw,sh,0,0,player.width,player.height)}
const creepers=[[250,300],[485,330],[790,720]].map((spawn,i)=>{const canvas=document.createElement('canvas');canvas.className='creeper';canvas.width=256;canvas.height=256;canvas.setAttribute('aria-label','Verdant Creeper');world.appendChild(canvas);return{canvas,ctx:canvas.getContext('2d'),spawn,x:spawn[0],y:spawn[1],hp:5,alive:true,nextAttack:0,attacking:false,attackStarted:0,attackFrame:0,hitDone:false,facing:['down','left','up'][i],moving:false,changeAt:0,step:i*1.2}});
function chooseCreeperState(enemy,now){enemy.moving=Math.random()>.3;enemy.facing=['up','left','right','down'][Math.floor(Math.random()*4)];enemy.changeAt=now+(enemy.moving?900+Math.random()*1400:650+Math.random()*1100)}
function drawCreeper(enemy){if(!enemy.alive)return;const ctx=enemy.ctx,rows={up:0,left:1,right:2,down:3};ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,256,256);if(enemy.attacking&&creeperImages.attack.complete&&creeperImages.attack.naturalWidth)ctx.drawImage(creeperImages.attack,enemy.attackFrame*256,rows[enemy.facing]*256,256,256,0,0,256,256);else if(enemy.moving&&creeperImages.walk.complete&&creeperImages.walk.naturalWidth){const frame=Math.floor(enemy.step)%4;ctx.drawImage(creeperImages.walk,frame*256,rows[enemy.facing]*256,256,256,0,0,256,256)}else if(creeperImages.idle.complete&&creeperImages.idle.naturalWidth)ctx.drawImage(creeperImages.idle,0,0,256,256)}
function updateHealth(){healthHud.textContent='♥'.repeat(playerHp)+'♡'.repeat(5-playerHp)}
function setBlocking(on){blocking=!!on&&!playerDead&&progress.equipped!=='none';player.classList.toggle('blocking',blocking);if(on&&!blocking)showMessage('EQUIP A WEAPON TO BLOCK')}
function startCreeperAttack(enemy,now){enemy.attacking=true;enemy.moving=false;enemy.attackStarted=now;enemy.attackFrame=0;enemy.hitDone=false;enemy.nextAttack=now+1250}
function resolveCreeperHit(enemy,now){if(enemy.hitDone)return;enemy.hitDone=true;if(Math.hypot(enemy.x-cam.x,enemy.y-cam.y)>58)return;if(blocking){showMessage('BLOCKED');gain(progress.equipped==='staff'?'staff':'vibe',1);return}if(playerDead||now<invulnerableUntil)return;invulnerableUntil=now+650;playerHp--;updateHealth();player.animate([{opacity:1},{opacity:.15},{opacity:1},{opacity:.15},{opacity:1}],{duration:500});if(playerHp<=0){playerDead=true;blocking=false;player.classList.remove('blocking');deathScreen.classList.add('show')}else showMessage(`CREEPER HIT · ${playerHp}/5 VIBE`)}
function updateCreepers(dt,now){if(scene!=='outdoor')return;const dirs={up:[0,-1],left:[-1,0],right:[1,0],down:[0,1]};for(const enemy of creepers){if(!enemy.alive)continue;const toPlayerX=cam.x-enemy.x,toPlayerY=cam.y-enemy.y,playerDistance=Math.hypot(toPlayerX,toPlayerY),nearPlayer=!playerDead&&playerDistance<150;if(enemy.attacking){const elapsed=now-enemy.attackStarted;enemy.attackFrame=Math.min(4,Math.floor(elapsed/105));if(enemy.attackFrame>=2)resolveCreeperHit(enemy,now);if(elapsed>=525){enemy.attacking=false;enemy.attackFrame=0;enemy.changeAt=now+300}}else{if(nearPlayer){enemy.moving=playerDistance>43;if(Math.abs(toPlayerX)>Math.abs(toPlayerY))enemy.facing=toPlayerX<0?'left':'right';else enemy.facing=toPlayerY<0?'up':'down'}else if(now>=enemy.changeAt)chooseCreeperState(enemy,now);if(playerDistance<52&&now>=enemy.nextAttack)startCreeperAttack(enemy,now);if(enemy.moving&&!enemy.attacking){const [dx,dy]=dirs[enemy.facing],radius=160,nx=enemy.x+dx*(nearPlayer?55:42)*dt,ny=enemy.y+dy*(nearPlayer?55:42)*dt,insidePatrol=nx>=enemy.spawn[0]-radius&&nx<=enemy.spawn[0]+radius&&ny>=enemy.spawn[1]-radius&&ny<=enemy.spawn[1]+radius,insideWorld=nx>35&&nx<bounds.w-35&&ny>50&&ny<bounds.h-35,insideHome=nx>homeBlock.x-25&&nx<homeBlock.x+homeBlock.w+25&&ny>homeBlock.y-25&&ny<homeBlock.y+homeBlock.h+25,playerClear=Math.hypot(nx-cam.x,ny-cam.y)>=40,enemyClear=creepers.every(other=>other===enemy||!other.alive||Math.hypot(nx-other.x,ny-other.y)>=34);if(insidePatrol&&insideWorld&&!insideHome&&playerClear&&enemyClear){enemy.x=nx;enemy.y=ny;enemy.step+=dt*8}else if(!nearPlayer)chooseCreeperState(enemy,now)}}enemy.canvas.style.left=`${enemy.x}px`;enemy.canvas.style.top=`${enemy.y}px`;drawCreeper(enemy)}}
function equipmentName(type){return type==='staff'?'AURA STAFF':type==='hands'?'HANDS OF THORNE':'NONE'}
function updateEquipment(){currentWalkImage=walkImages[progress.equipped];currentWalkImage.addEventListener('load',()=>drawPlayerFrame(0),{once:true});drawPlayerFrame(0);weaponWheel.classList.toggle('staff',progress.equipped==='staff');weaponWheel.classList.toggle('hands',progress.equipped==='hands');weaponWheel.classList.toggle('locked',!progress.hasStaff&&!progress.hasHands);weaponWheel.setAttribute('aria-label',`Equipped: ${equipmentName(progress.equipped)}`)}
function cycleWeapon(){const owned=['none',...(progress.hasStaff?['staff']:[]),...(progress.hasHands?['hands']:[])];if(owned.length===1)return showMessage('WEAPON WHEEL · NO EQUIPMENT');progress.equipped=owned[(owned.indexOf(progress.equipped)+1)%owned.length];localStorage.setItem('arborynthProgress',JSON.stringify(progress));updateEquipment();showMessage(`EQUIPPED · ${equipmentName(progress.equipped)}`)}
function equipStaff(){if(progress.hasStaff)return;progress.hasStaff=true;progress.equipped='staff';groundStaff.style.display='none';updateEquipment();localStorage.setItem('arborynthProgress',JSON.stringify(progress));showMessage('AURA STAFF ACQUIRED · EQUIPPED')}
function equipHands(){if(progress.hasHands)return;progress.hasHands=true;progress.equipped='hands';groundHands.style.display='none';updateEquipment();localStorage.setItem('arborynthProgress',JSON.stringify(progress));showMessage('HANDS OF THORNE ACQUIRED · EQUIPPED')}
function enterHome(){scene='indoor';bounds.w=bounds.h=768;cam={x:384,y:650};facing='up';playerHome.style.display='none';homeLabel.style.display='none';groundStaff.style.display='none';groundHands.style.display='none';interiorDoor.style.display='block';creepers.forEach(enemy=>enemy.canvas.style.display='none');locationLabel.textContent='PLAYER HOME · 16 × 16';drawTileMap(homeFloorTexture,16,48);showMessage('PLAYER HOME')}
function exitHome(){scene='outdoor';bounds.w=bounds.h=1024;cam={x:760,y:438};facing='down';playerHome.style.display='block';homeLabel.style.display='block';groundStaff.style.display=progress.hasStaff?'none':'block';groundHands.style.display=progress.hasHands?'none':'block';interiorDoor.style.display='none';creepers.forEach(enemy=>enemy.canvas.style.display=enemy.alive?'block':'none');locationLabel.textContent='FOREST OF THE GODVINE · 32 × 32';drawTileMap(floorTexture,32);showMessage('FOREST OF THE GODVINE')}
function interact(){if(scene==='indoor'){if(Math.hypot(cam.x-interiorExitPos.x,cam.y-interiorExitPos.y)<70)return exitHome();return showMessage('NOTHING TO INTERACT WITH')}if(!progress.hasStaff&&Math.hypot(cam.x-staffPos.x,cam.y-staffPos.y)<72)return equipStaff();if(!progress.hasHands&&Math.hypot(cam.x-handsPos.x,cam.y-handsPos.y)<72)return equipHands();if(Math.hypot(cam.x-houseDoorPos.x,cam.y-houseDoorPos.y)<82)return enterHome();showMessage('NOTHING TO INTERACT WITH')}
function hitCreeper(){const vectors={up:[0,-1],left:[-1,0],right:[1,0],down:[0,1]},[fx,fy]=vectors[facing];let target=null,best=86;for(const enemy of creepers){if(!enemy.alive)continue;const dx=enemy.x-cam.x,dy=enemy.y-cam.y,d=Math.hypot(dx,dy),dot=(dx*fx+dy*fy)/(d||1);if(d<best&&dot>.1){target=enemy;best=d}}if(!target)return;target.hp--;target.canvas.animate([{filter:'brightness(1)'},{filter:'brightness(3) sepia(1)'},{filter:'brightness(1)'}],{duration:220});if(target.hp<=0){target.alive=false;target.canvas.style.display='none';showMessage('VERDANT CREEPER DEFEATED');gain('staff',12)}else showMessage(`CREEPER HIT · ${target.hp}/5`)}
function basicAttack(){if(playerDead)return;if(progress.equipped==='none')return showMessage('EQUIP A WEAPON FROM THE WHEEL');if(attacking||blocking)return;attacking=true;hitCreeper();if(progress.equipped==='hands'){player.animate([{transform:'translate(-50%,-70%)'},{transform:'translate(-50%,-70%) scale(1.18)'},{transform:'translate(-50%,-70%)'}],{duration:260});setTimeout(()=>attacking=false,280);return}player.style.visibility='hidden';staffAttack.style.backgroundImage=`url("${attackSheets[facing]}")`;staffAttack.style.display='block';let frame=0;staffAttack.style.backgroundPosition='0% center';const timer=setInterval(()=>{frame++;if(frame>=5){clearInterval(timer);staffAttack.style.display='none';player.style.visibility='visible';attacking=false;gain('staff',2);return}staffAttack.style.backgroundPosition=`${frame*25}% center`},85)}
function revivePlayer(){playerHp=5;playerDead=false;invulnerableUntil=performance.now()+1200;cam={x:620,y:500};deathScreen.classList.remove('show');updateHealth();showMessage('RETURNED TO PLAYER HOME')}
function action(type){if(playerDead){if(type==='staff')revivePlayer();return}if(type==='interact')return interact();if(type==='attack')return basicAttack();if(type==='weapon')return cycleWeapon();if(type==='menu')return showMessage('MENU · COMING SOON');if(type==='staff'){if(!progress.hasStaff)return showMessage('AURA STAFF NOT YET ACQUIRED');const p=document.querySelector('#pulse');p.classList.remove('fire');void p.offsetWidth;p.classList.add('fire');player.animate([{filter:'brightness(1)'},{filter:'brightness(1.8) drop-shadow(0 0 8px #7de6de)'},{filter:'brightness(1)'}],{duration:500});gain('staff',4)}else{player.animate([{filter:'brightness(1)'},{filter:'brightness(1.6) drop-shadow(0 0 8px #8ef0b1)'},{filter:'brightness(1)'}],{duration:500});gain('vibe',3)}}
document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;el.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();keys[k]=false}))});document.querySelectorAll('[data-action]:not([data-action="block"])').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();action(el.dataset.action)}));const blockButton=document.querySelector('[data-action="block"]');blockButton.addEventListener('pointerdown',e=>{e.preventDefault();setBlocking(true);blockButton.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(n=>blockButton.addEventListener(n,e=>{e.preventDefault();setBlocking(false)}));
const keyboardButtons={y:'.y',x:'.x',b:'.b',a:'.a','1':'.select','2':'.menu','3':'.start'};addEventListener('keydown',e=>{const arrow=e.key.startsWith('Arrow')?e.key:null,key=e.key.toLowerCase(),selector=keyboardButtons[key];if(!arrow&&!selector)return;e.preventDefault();if(arrow){keys[arrow]=true;document.querySelector(`[data-key="${arrow}"]`)?.classList.add('pressed')}else{const button=document.querySelector(selector);button?.classList.add('pressed');if(button?.dataset.action==='block')setBlocking(true);else if(!e.repeat&&button?.dataset.action)action(button.dataset.action)}});addEventListener('keyup',e=>{const arrow=e.key.startsWith('Arrow')?e.key:null,key=e.key.toLowerCase(),selector=keyboardButtons[key];if(arrow){keys[arrow]=false;document.querySelector(`[data-key="${arrow}"]`)?.classList.remove('pressed')}if(selector){const button=document.querySelector(selector);button?.classList.remove('pressed');if(button?.dataset.action==='block')setBlocking(false)}});
weaponWheel.addEventListener('pointerdown',e=>{e.preventDefault();cycleWeapon()});
const controller=document.querySelector('.chassis');['dblclick','contextmenu','dragstart','selectstart'].forEach(type=>controller.addEventListener(type,e=>e.preventDefault()));controller.querySelectorAll('img').forEach(img=>img.draggable=false);
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;let dx=playerDead||blocking||attacking?0:(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),dy=playerDead||blocking||attacking?0:(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);if(dx&&dy){dx*=.707;dy*=.707}const moving=dx||dy,s=screen;if(moving){if(Math.abs(dx)>Math.abs(dy))facing=dx<0?'left':'right';else facing=dy<0?'up':'down'}let nx=Math.max(s.clientWidth/2,Math.min(bounds.w-s.clientWidth/2,cam.x+dx*135*dt)),ny=Math.max(s.clientHeight/2,Math.min(bounds.h-s.clientHeight/2,cam.y+dy*135*dt));const blocked=(x,y)=>scene==='outdoor'&&(x>homeBlock.x&&x<homeBlock.x+homeBlock.w&&y>homeBlock.y&&y<homeBlock.y+homeBlock.h||creepers.some(enemy=>enemy.alive&&Math.hypot(x-enemy.x,y-enemy.y)<40));if(!blocked(nx,cam.y))cam.x=nx;if(!blocked(cam.x,ny))cam.y=ny;world.style.transform=`translate(${s.clientWidth/2-cam.x}px,${s.clientHeight/2-cam.y}px)`;const nearStaff=scene==='outdoor'&&!progress.hasStaff&&Math.hypot(cam.x-staffPos.x,cam.y-staffPos.y)<72,nearHands=scene==='outdoor'&&!progress.hasHands&&Math.hypot(cam.x-handsPos.x,cam.y-handsPos.y)<72,nearHouse=scene==='outdoor'&&Math.hypot(cam.x-houseDoorPos.x,cam.y-houseDoorPos.y)<82,nearExit=scene==='indoor'&&Math.hypot(cam.x-interiorExitPos.x,cam.y-interiorExitPos.y)<70;if(!messageTimer&&(nearStaff||nearHands||nearHouse||nearExit)){prompt.textContent=nearStaff?'PRESS A · PICK UP AURA STAFF':nearHands?'PRESS A · PICK UP HANDS OF THORNE':nearHouse?'PRESS A · ENTER PLAYER HOME':'PRESS A · EXIT HOME';prompt.classList.add('show')}else if(!messageTimer)prompt.classList.remove('show');if(moving){step+=dt*11;distance+=135*dt;if(distance>320){distance=0;gain('vibe',7)}}drawPlayerFrame(moving?Math.floor(step)%4:0);updateCreepers(dt,now);player.style.transform='translate(-50%,-70%)';requestAnimationFrame(loop)}if(progress.hasStaff)groundStaff.style.display='none';if(progress.hasHands)groundHands.style.display='none';updateEquipment();updateHealth();render();requestAnimationFrame(loop)})();
</script></body></html>
