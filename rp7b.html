<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The AOV Saga · Rize of Power (RP7B · rewrite skeleton v0.3)</title>
  <meta name="description" content="RP7 Rize of Power — clean-slate skeleton build v0.3. 15x15 grass field + rizer sprite standing.">

  <!-- ★ AOV controller boot · absolute paths (canon per aov-controller-priority) -->

  <script>
    window.aovNavOwnedByGame    = true;
    window.aovNavRequireOverlay = true;
  </script>
  <script src="/card-game-controller-nav.js" data-gamepad-owner="native"></script>

  <style>
    *{box-sizing:border-box}
    html,body{
      margin:0; padding:0; width:100%; height:100%;
      background:#000; color:#f0eadf;
      font-family: "Courier New", ui-monospace, Menlo, monospace;
      overflow:hidden; user-select:none;
    }
    #stage{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:#000;
    }
    /* letterbox — never stretch (canon: image-never-stretch-console-fullscreen) */
    #game{
      display:block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background:#000;
      max-width:min(100vw, 100vh);
      max-height:min(100vw, 100vh);
      width:auto; height:auto;
    }
    #hud{
      position:fixed; top:12px; left:12px;
      background: rgba(0,0,0,0.55);
      color:#f0eadf; padding:6px 10px;
      font-size:12px; letter-spacing:.08em;
      border-left:2px solid #d4af37;
      pointer-events:none;
      z-index:5;
    }
    #padStatus{
      position:fixed; bottom:12px; left:12px;
      background: rgba(0,0,0,0.6);
      color:#8ff; font-size:11px; letter-spacing:.1em;
      padding:6px 10px; border:1px solid #244;
      pointer-events:none;
      z-index:5;
    }
    #hint{
      position:fixed; bottom:12px; right:12px;
      background: rgba(0,0,0,0.5);
      color:#ddd; font-size:11px; letter-spacing:.08em;
      padding:6px 10px; border-right:2px solid #d4af37;
      pointer-events:none;
      z-index:5;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="528" height="528"></canvas>
  </div>
  <div id="hud">RP7 · RIZE OF POWER · skeleton v0.3 · 15×15 grass</div>
  <div id="hint">Arrows / D-pad · × / X interact · L3 sprint toggle · Options pause</div>

<script>
'use strict';

//////////////////////////////////////////////////////////////////////////////
// RP7B · CLEAN-SLATE SKELETON v0.3 (2026-08-05)
//
// - 15x15 tile map, ALL grass (720x720 canvas at TILE=48)
// - Each grass tile = one full outdoor-grass.png (1:1 · one PNG per tile)
// - Player sprite from /assets/2D sprites/rizer/{idle,walk,run}.png
//     idle 2172x724  · 4 cols x 1 row · cell 543x724 (down/left/right/up)
//     walk 1254x1254 · 4 cols x 4 rows · cell 313x313
//     run  1254x1254 · same layout as walk
// - Magenta chroma-key on load (canon aov-chroma-key-canon)
// - Player drawn 2 tiles tall (canon override for this rewrite) with
//   aspect preserved from the source cell — feet anchored to tile bottom.
// - Full 15x15 visible at once — no camera scroll.
//////////////////////////////////////////////////////////////////////////////

const TILE = 48;
// World grid: 45 cols x 90 rows (each 15x15 sub-map).  Horizontal:
//   cols 0-14   · west band   (empty grass · 2026-08-05)
//   cols 15-29  · center band (has all placed content)
//   cols 30-44  · east band   (empty grass · 2026-08-05)
// Vertical (6 stacked 15-row bands):
//   rows 0-14   · far-north      (empty)
//   rows 15-29  · north-2        (empty)
//   rows 30-44  · town-hall      (MALEZOR TOWN HALL + 14 bushes)
//   rows 45-59  · north buffer   (empty)
//   rows 60-74  · middle         (PLAYER HOME · player spawn)
//   rows 75-89  · south          (empty)
const MAP_COLS = 45, MAP_ROWS = 90;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ★ Pokemon-GBA-style camera · player is ALWAYS at viewport center.
// World draw offset is subtracted from every world-space coordinate so
// the world scrolls under a fixed-center player.  Black shows past map
// edges when the player is near a corner (no clamping).
const _cam = { x: 0, y: 0 };
function updateCamera(){
  _cam.x = Math.floor(player.x * TILE + TILE / 2 - canvas.width  / 2);
  _cam.y = Math.floor(player.y * TILE + TILE / 2 - canvas.height / 2);
}

// -- Player state ------------------------------------------------------------
const player = {
  x: 22, y: 68,                 // tile coords · one below player home door (middle band, center col)
  dir: 'up',                    // start facing the home
  moving: false,
  moveCd: 0,
  animFrame: 0,
  running: false,               // computed per-frame · true when moving fast
  sprintLocked: false,          // toggled by L3 click · adds to shift/b sprint holds
  party: [],                    // caught Zyrex list · touchpad toggles menu
  stepsInGrass: 0,              // consecutive gemgrass steps for encounter roll
  items: {},                    // inventory · {itemKey: count} · chests + NPCs
};

// -- Inventory / items ------------------------------------------------------
// Every item source (chests, NPCs later) funnels through addItems(drop).
// Settings > Items renders whatever's in player.items using INVENTORY_META.
const INVENTORY_META = {
  coins:            { label: 'Coins',             order:  0 },
  gem:              { label: 'Gems',              order: 10 },
  moon_gem:         { label: 'Moon Gems',         order: 20 },
  potion:           { label: 'Potions',           order: 30 },
  zysphere_basic:   { label: 'Basic Zysphere',    order: 40 },
  zysphere_void:    { label: 'Void Zysphere',     order: 41 },
  zysphere_silver:  { label: 'Silver Zysphere',   order: 42 },
  zysphere_ultra:   { label: 'Ultra Zysphere',    order: 43 },
  rare_item:        { label: 'Rare Item',         order: 50 },
  prismshard:       { label: 'Legendary Prismshard', order: 60 },
};
function addItems(drop){
  for (const key in drop){
    player.items[key] = (player.items[key] || 0) + drop[key];
  }
}
function lootToString(drop){
  const meta = INVENTORY_META;
  const parts = [];
  for (const key in drop){
    const lbl = (meta[key] && meta[key].label) || key;
    parts.push(`${drop[key]}× ${lbl}`);
  }
  return parts.join(' + ');
}
function sortedInventoryEntries(){
  const meta = INVENTORY_META;
  return Object.entries(player.items)
    .filter(([, n]) => n > 0)
    .sort((a, b) => ((meta[a[0]] && meta[a[0]].order) || 999) -
                    ((meta[b[0]] && meta[b[0]].order) || 999));
}

// -- World props (buildings, trees, decor) ----------------------------------
// Each prop has:
//   img      · <img> element (pre-baked RGBA · no runtime chroma-key)
//   bbox     · [bx,by,bw,bh] in source pixels · crops out padding
//   tileX/Y  · tile coordinates of the prop's FEET/BASE (bottom-center)
//   tileW/H  · visual size in tiles (drawH derived from source aspect)
//   footprint· array of [dx,dy] offsets from base tile that BLOCK movement
//   door     · optional [dx,dy] tile that IS walkable within the footprint

// ★ Gemgrass patch definitions · shared by both the grass IIFE and the
// flower-perimeter IIFE below.  Sized 1x2 to 5x7 in naturally open
// spaces between homes.  Any change here re-drives both grass + flowers.
const GEMGRASS_PATCHES = [
  // Far-north band (rows 0-14)
  { x: 15, y:  2, w: 5, h: 4 },
  { x: 25, y:  8, w: 4, h: 3 },
  { x:  2, y: 12, w: 3, h: 3 },
  // North-2 band (rows 15-29)
  { x: 25, y: 15, w: 3, h: 3 },
  { x: 15, y: 25, w: 5, h: 4 },
  { x:  3, y: 20, w: 4, h: 3 },
  // Town-hall band edges (rows 30-44)
  { x:  2, y: 32, w: 2, h: 5 },
  { x: 40, y: 30, w: 3, h: 5 },
  { x: 40, y: 40, w: 5, h: 4 },
  // Buffer band (rows 45-59)
  { x: 15, y: 45, w: 5, h: 2 },
  { x: 26, y: 47, w: 3, h: 3 },
  { x: 40, y: 52, w: 4, h: 5 },
  { x:  0, y: 55, w: 3, h: 4 },
  // Middle band (rows 60-74) — has player home
  { x: 40, y: 62, w: 4, h: 5 },
  { x:  2, y: 62, w: 3, h: 4 },
  { x: 26, y: 63, w: 4, h: 3 },
  // South band (rows 75-89)
  { x:  3, y: 76, w: 5, h: 5 },
  { x: 15, y: 82, w: 5, h: 7 },
  { x: 40, y: 78, w: 5, h: 5 },
  { x: 25, y: 75, w: 4, h: 3 },
];

const WORLD_PROPS = [
  {
    id: 'player_home',
    img: new Image(),
    src: 'assets/2D%20sprites/buildings/player-home.png',
    bbox: [121, 89, 1012, 1056],
    tileX: 22, tileY: 67,     // door tile · middle band, center col
    tileW: 5, tileH: 5,       // 5 tiles wide, 5 tiles tall on screen
    // Footprint offsets relative to (tileX, tileY) — the full 5x5 base is
    // solid.  Door tile IS blocked (player can't walk onto it) but is
    // registered in _propDoors so pressing Z while facing it triggers the
    // door dialog from the adjacent tile.
    footprint: (function(){
      const f = [];
      for (let dy = -4; dy <= 0; dy++){
        for (let dx = -2; dx <= 2; dx++){
          f.push([dx, dy]);
        }
      }
      return f;
    })(),
    door:  [0, 0],                              // interact target at tile 7,7
    onInteract: () => showToast('◈ HOME · door is locked for now.', 2200),
  },
  {
    id: 'malezor_town_hall',
    img: new Image(),
    src: 'assets/2D%20sprites/buildings/town-hall.png',
    // Content bbox in source sheet (65, 27, 1273, 987) · aspect 1.29
    bbox: [65, 27, 1273, 987],
    tileX: 22, tileY: 40,      // door tile · town-hall band, center col
    tileW: 11, tileH: 9,       // 11 wide x 9 tall on screen (grand hall)
    // Full 11x9 footprint solid · door tile at (7,10) is interact-only
    footprint: (function(){
      const f = [];
      for (let dy = -8; dy <= 0; dy++){
        for (let dx = -5; dx <= 5; dx++){
          f.push([dx, dy]);
        }
      }
      return f;
    })(),
    door:  [0, 0],
    onInteract: () => showToast('◈ MALEZOR TOWN HALL · Closed for now.', 2200),
  },
  // ── CHESTS · tier-based loot · swaps sprite when opened ────────────
  // Three tiers (wood/silver/gold) with escalating loot tables.  Each
  // chest starts closed, swaps to open-chest sprite on first interact,
  // and stays silent on re-interact (no dead-actor prompt).
  ...(function(){
    // [tileX, tileY, tier]
    const CHEST_POSITIONS = [
      [13,  5, 'wood'],           // far-north NW
      [32, 12, 'silver'],         // far-north NE
      [ 5, 22, 'wood'],           // north-2 W
      [28, 17, 'wood'],           // north-2 NE
      [ 5, 44, 'silver'],         // town-hall SW
      [44, 45, 'gold'],           // buffer NE corner
      [25, 50, 'silver'],         // buffer center between reds
      [44, 82, 'gold'],           // south SE corner
    ];
    const _closedImg = new Image(); _closedImg.src = 'assets/2D%20sprites/decor/chest.png';
    const _openImg   = new Image(); _openImg.src   = 'assets/2D%20sprites/decor/chest-open.png';
    const CLOSED_BBOX = [362, 329, 676, 467];   // aspect 1.45
    const OPEN_BBOX   = [290, 240, 673, 741];   // aspect 0.91 (taller · lid up)
    // Structured loot · each entry is a { itemKey: count } dict.  On chest
    // open, we (a) merge these counts into player.items and (b) build a
    // human-readable string for the toast.  Item keys match INVENTORY_META
    // labels so Settings > Items can render them nicely.
    const LOOT_BY_TIER = {
      wood: [
        { coins: 10 },
        { coins: 15, potion: 1 },
        { coins: 5, gem: 3 },
        { zysphere_basic: 1 },
      ],
      silver: [
        { coins: 50, gem: 5 },
        { zysphere_void: 2 },
        { zysphere_silver: 1, potion: 1 },
        { coins: 75, moon_gem: 1 },
      ],
      gold: [
        { coins: 200, gem: 10 },
        { zysphere_ultra: 1, rare_item: 1 },
        { coins: 100, moon_gem: 3 },
        { prismshard: 1 },
      ],
    };
    return CHEST_POSITIONS.map(([tx, ty, tier], i) => {
      const chest = {
        id: `chest_${i}`,
        img: _closedImg,
        src: 'assets/2D%20sprites/decor/chest.png',
        bbox: CLOSED_BBOX,
        tileX: tx, tileY: ty,
        tileW: 1, tileH: 1,
        footprint: [[0, 0]],
        door: [0, 0],
        opened: false,
        tier,
      };
      chest.onInteract = () => {
        if (chest.opened) return;   // dead actor · no re-interact prompt
        chest.opened = true;
        chest.img = _openImg;
        chest.bbox = OPEN_BBOX;
        const table = LOOT_BY_TIER[tier] || LOOT_BY_TIER.wood;
        const drop  = table[Math.floor(Math.random() * table.length)];
        addItems(drop);   // merge into player.items · defined below
        showToast(`◈ ${tier.toUpperCase()} CHEST · ${lootToString(drop)}`, 2800);
      };
      return chest;
    });
  })(),
  // ── GEMGRASS PATCHES + per-tile grass overlay ──────────────────────
  // Every wildZone (grassblade) tile gets a PAIRED grass-patch overlay
  // (A or B chosen by non-uniform hash) so the pretty layer covers 100%
  // of the encounter area · no two adjacent tiles share the same variant.
  // Grassblade layer stays as the DEV VISUAL STANDARD + wildZone marker.
  // Both are non-blocking (walkable).  Zyrex spawns per RP7 canon
  // (aov-rp7-gameplay-loop-canon · aov-district-type-pool · Malezor T1s
  // from aov-t1-foundation-canon).
  ...(function(){
    const PATCHES = GEMGRASS_PATCHES;
    const _grassImg = new Image();
    _grassImg.src = 'assets/2D%20sprites/decor/grassblade.png';
    const _grassBBox = [112, 366, 1179, 446];   // content in 1402x1122
    const _gaImg = new Image(); _gaImg.src = 'assets/2D%20sprites/decor/grass-patch-a.png';
    const _gbImg = new Image(); _gbImg.src = 'assets/2D%20sprites/decor/grass-patch-b.png';
    const _gaBBox = [ 0, 0, 96, 128];
    const _gbBBox = [32, 0, 96, 128];
    // Non-uniform A/B hash — mixes across x & y with prime-multipliers
    // so no obvious checkerboard or stripe pattern.
    const useA = (x, y) => ((x * 13 + y * 7 + x * y) & 1) === 0;
    const tiles = [];
    for (const p of PATCHES){
      for (let dy = 0; dy < p.h; dy++){
        for (let dx = 0; dx < p.w; dx++){
          const x = p.x + dx, y = p.y + dy;
          // (1) Grassblade — dev standard visual + wildZone marker
          // (re-enabled 2026-08-05 · fires wild-Zyrex battle when
          // player.party.length > 0)
          tiles.push({
            id: `gemgrass_${x}_${y}`,
            img: _grassImg,
            src: 'assets/2D%20sprites/decor/grassblade.png',
            bbox: _grassBBox,
            tileX: x, tileY: y,
            tileW: 1, tileH: 1,
            footprint: [],
            wildZone: true,
          });
          // (2) Pretty grass patch overlay · one per grassblade tile
          const a = useA(x, y);
          tiles.push({
            id: `grass_overlay_${x}_${y}`,
            img: a ? _gaImg : _gbImg,
            src: a ? 'assets/2D%20sprites/decor/grass-patch-a.png'
                   : 'assets/2D%20sprites/decor/grass-patch-b.png',
            bbox: a ? _gaBBox : _gbBBox,
            tileX: x, tileY: y,
            tileW: 1, tileH: 1,       // 1-tile visual (aspect preserved · ~1.33 tall)
            footprint: [],
          });
        }
      }
    }
    return tiles;
  })(),
  // ── RED-ROOF HOUSES · 5 in the buffer between hall & home ──────────
  // User (2026-08-05): "distributed evenly between player home and town
  // hall".  All 5 sit in the ~20-row stretch of rows 45-62 (north buffer
  // band + 1-2 tiles into neighboring bands).  Spaced from existing
  // green villager-homes at (10,42) and (10,72).  5-tile footprint.
  ...(function(){
    const RR_POSITIONS = [
      [ 6, 52],   // W upper-buffer   · footprint cols 4-8   rows 48-52
      [36, 51],   // E upper-buffer   · footprint cols 34-38 rows 47-51
      [22, 56],   // C middle-buffer  · footprint cols 20-24 rows 52-56
      [12, 60],   // SW lower-buffer  · footprint cols 10-14 rows 56-60
      [32, 60],   // SE lower-buffer  · footprint cols 30-34 rows 56-60
    ];
    const _rrImg = new Image();
    _rrImg.src = 'assets/2D%20sprites/buildings/red-roof-home.png';
    const _rrBBox = [130, 106, 993, 1043];
    return RR_POSITIONS.map(([tx, ty], i) => ({
      id: `red_roof_home_${i}`,
      img: _rrImg,
      src: 'assets/2D%20sprites/buildings/red-roof-home.png',
      bbox: _rrBBox,
      tileX: tx, tileY: ty,
      tileW: 5, tileH: 5,
      footprint: (function(){
        const f = [];
        for (let dy = -4; dy <= 0; dy++){
          for (let dx = -2; dx <= 2; dx++){
            f.push([dx, dy]);
          }
        }
        return f;
      })(),
      door: [0, 0],
      onInteract: () => showToast('◈ A neighbor\'s home.  Locked for now.', 2200),
    }));
  })(),
  // ── VILLAGER HOUSES · 5 scattered across all bands ─────────────────
  ...(function(){
    // Each entry: [tileX, tileY, band-label] · door tile = (tileX, tileY)
    const HOUSE_POSITIONS = [
      [10, 12, 'far-north west'],   // far-north band (rows 0-14)
      [35, 22, 'north-2 east'],     // north-2 band (rows 15-29)
      [10, 42, 'town-hall west'],   // town-hall band, west of hall + bushes
      [10, 72, 'middle west'],      // middle band, west of player home
      [35, 82, 'south east'],       // south band (rows 75-89)
    ];
    const _vhImg = new Image();
    _vhImg.src = 'assets/2D%20sprites/buildings/villager-home.png';
    const _vhBBox = [141, 78, 966, 1077];
    return HOUSE_POSITIONS.map(([tx, ty, label], i) => ({
      id: `villager_home_${i}`,
      img: _vhImg,
      src: 'assets/2D%20sprites/buildings/villager-home.png',
      bbox: _vhBBox,
      tileX: tx, tileY: ty,
      tileW: 5, tileH: 5,           // same footprint as player home
      footprint: (function(){
        const f = [];
        for (let dy = -4; dy <= 0; dy++){
          for (let dx = -2; dx <= 2; dx++){
            f.push([dx, dy]);
          }
        }
        return f;
      })(),
      door: [0, 0],
      onInteract: () => showToast('◈ Somebody lives here.  Door is locked.', 2200),
    }));
  })(),
  // ── BUSHES · Malezor Town Hall garden ──────────────────────────────
  // Realistic landscape: front-lawn flanking the door approach,
  // side hedges running along the building's east/west, scattered
  // outer decor.  Door approach column 7 stays clear.
  ...(function(){
    const BUSH_POSITIONS = [
      // Front flanks (row 41, immediately south of the building base)
      [18, 41], [20, 41], [24, 41], [26, 41],
      // Side hedges along west (col 16) and east (col 28) of building
      [16, 35], [16, 37], [16, 39],
      [28, 35], [28, 37], [28, 39],
      // Mid-lawn landscaping (leaves col 22 door path clear)
      [17, 42], [27, 42],
      [19, 43], [25, 43],
    ];
    // Share ONE image + bbox across all bush instances so we only
    // load the PNG once (browser dedupes but this keeps state clean).
    const _bushImg = new Image();
    _bushImg.src = 'assets/2D%20sprites/decor/bush.png';
    const _bushBBox = [291, 274, 965, 471];
    return BUSH_POSITIONS.map(([tx, ty], i) => ({
      id: `bush_${i}`,
      img: _bushImg,
      src: 'assets/2D%20sprites/decor/bush.png',
      bbox: _bushBBox,
      tileX: tx, tileY: ty,
      tileW: 2, tileH: 1,           // 2-tile wide visual, feet at tileY
      footprint: [[0, 0]],           // single-tile collision at anchor
    }));
  })(),
];

// Load prop images (pre-baked · no chroma-key needed)
WORLD_PROPS.forEach(p => { p.img.src = p.src; });

// Collision + interact + wildZone maps · computed once from props.
const _propBlocked = new Set();     // "x,y" of solid tiles
const _propDoors   = new Map();     // "x,y" → prop with onInteract
const _wildZones   = new Set();     // "x,y" tiles that spawn wild Zyrex
WORLD_PROPS.forEach(p => {
  p.footprint.forEach(([dx,dy]) => _propBlocked.add(`${p.tileX+dx},${p.tileY+dy}`));
  if (p.door) _propDoors.set(`${p.tileX + p.door[0]},${p.tileY + p.door[1]}`, p);
  if (p.wildZone) _wildZones.add(`${p.tileX},${p.tileY}`);
});

function walkable(x, y){
  if (x < 0 || y < 0 || x >= MAP_COLS || y >= MAP_ROWS) return false;
  if (_propBlocked.has(`${x},${y}`)) return false;
  return true;
}

// -- Per-cell content bboxes ------------------------------------------------
// ★ 2026-08-05 · RIZER SPRITES PURGED · awaiting fresh delivery from user.
// When new sheets arrive, they're pre-baked (alpha=0 bg via
// scripts/bake_sprite_alpha.py) and bboxes get measured with the
// flood-fill island filter (min 50-pixel cluster) before landing here.
// Layout contract stays: 4x4 sheets (row=direction · col=frame · dims
// per aov-sprite-4x4-standard memory).
//
// Until sprites are re-added, drawPlayer draws a placeholder rectangle
// so the player position is still visible during playtest.
// Bboxes measured with flood-fill island filter (min 50-px cluster).
// idle/walk pending re-delivery from user.
const BBOX_FALLBACK = {
  // ★ CONNECTED-COMPONENT extractor (v0.19) · every bbox captures the
  // character's FULL connected shape regardless of cell boundary, then
  // assigns to the cell containing the feet.  Two consequences:
  //   - Up-facing bboxes now have NEGATIVE by to include hair spikes
  //     that overflow into row 2's cell area (idle -21, walk -19, run -23)
  //   - Right-facing bboxes are now clean because the disconnected cape
  //     trail that used to inflate bh=288 is a separate CC and ignored
  // Result: all bboxes across all poses in the tight 213-236 range,
  // so constant drawH renders truly consistent character size.
  idle: [
    [[132, 70,134,233],[ 96, 69,136,234],[64, 70,135,233],[29, 70,135,233]],
    [[140, 44,114,226],[102, 44,114,226],[72, 44,114,226],[36, 44,114,226]],
    [[142, 21,111,224],[109, 21,112,225],[79, 22,111,223],[42, 21,111,224]],
    [[130,-21,130,228],[ 95,-21,132,228],[62,-21,131,228],[29,-21,130,228]],
  ],
  // 2026-08-05 · new walk sheet · CC extractor merged neighboring cells
  // (adjacent character silhouettes touch across boundaries) · fell back

// -- PS5 DualSense poller · full RP7 canon mapping ---------------------------
// Per aov-controller-priority memory · buttons dispatch synthetic
// KeyboardEvent so keyboard router still works.  Menus follow RP7 classic:
//   Create   → '1' (SELECT · weapon-wheel select assignment)
//   Touchpad → '2' (main menu)
//   Options  → '3' (settings / pause)
// L3 click (button 10) toggles sprint-lock — hands-free running until pressed
// again.  Cross AND Square both fire interact so 'X' works in both PS5 ('×'
// = Cross) and Xbox ('X' = left face button = Square) terminology.
(function nativeGamepadController(){
  if (!navigator.getGamepads || window.__rp7SkeletonPad) return;
  window.__rp7SkeletonPad = true;

  const status = document.createElement('div');
  status.id = 'padStatus';
  status.textContent = 'PRESS ANY BUTTON';
  document.body.appendChild(status);

  // Standard gamepad button index → key mapping
  const BTN = {
    0:  'z',        // Cross    · interact / confirm
    1:  'Shift',    // Circle   · hold-sprint (parallel to Shift key)
    2:  'x',        // Square   · interact (Xbox-X convention)
    3:  'y',        // Triangle · reserved (attack later)
    4:  'l',        // L1       · party menu
    5:  'r',        // R1       · cycle mount
    6:  'q',        // L2       · quests menu
    7:  'i',        // R2       · items menu
    8:  '1',        // Create   · SELECT assignment
    9:  '3',        // Options  · settings / pause
    // 10 (L3) handled separately below · SPRINT TOGGLE
    11: 'Tab',      // R3       · weapon wheel
    12: 'ArrowUp',
    13: 'ArrowDown',
    14: 'ArrowLeft',
    15: 'ArrowRight',
    17: '2',        // Touchpad · main menu
  };
  const prev = {};
  const AXIS_DEAD = 0.35;

  function dispatchKey(type, key){
    const ev = new KeyboardEvent(type, { key: key, bubbles: true });
    window.dispatchEvent(ev);
    // Normalize to lowercase to match the keydown listener's keys map.
    const k = key.toLowerCase();
    if (type === 'keydown') keys[k] = true; else keys[k] = false;
  }

  function poll(){
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let pad = null;
    for (let i = 0; i < pads.length; i++) if (pads[i]) { pad = pads[i]; break; }
    if (pad){
      const lock = player.sprintLocked ? ' · SPRINT LOCKED' : '';
      status.textContent = 'DUALSENSE · CONNECTED · × INTERACT · L3 SPRINT' + lock;
      status.style.color = '#8f8';

      // ★ L3 click (button 10) · sprint toggle · edge-triggered on press.
      const l3 = pad.buttons[10];
      const l3Pressed = l3 && (l3.pressed || l3.value > 0.5);
      if (l3Pressed && !prev[10]){
        player.sprintLocked = !player.sprintLocked;
        showToast(player.sprintLocked ? '◈ SPRINT LOCKED' : '◈ SPRINT UNLOCKED', 1200);
      }
      prev[10] = l3Pressed;

      // Standard buttons
      pad.buttons.forEach((b, i) => {
        if (i === 10) return;   // handled above
        const key = BTN[i]; if (!key) return;
        const pressed = b.pressed || b.value > 0.5;
        if (pressed && !prev[i]) dispatchKey('keydown', key);
        else if (!pressed && prev[i]) dispatchKey('keyup', key);
        prev[i] = pressed;
      });

      // Left stick → arrow keys
      const lx = pad.axes[0] || 0, ly = pad.axes[1] || 0;
      const axisState = {
        ArrowLeft:  lx < -AXIS_DEAD,
        ArrowRight: lx >  AXIS_DEAD,
        ArrowUp:    ly < -AXIS_DEAD,
        ArrowDown:  ly >  AXIS_DEAD,
      };
      for (const k in axisState){
        const on = axisState[k];
        if (on && !prev['ax_'+k]) dispatchKey('keydown', k);
        else if (!on && prev['ax_'+k]) dispatchKey('keyup', k);
        prev['ax_'+k] = on;
      }
    }
    requestAnimationFrame(poll);
  }
  requestAnimationFrame(poll);
})();

// -- Movement · one tile step per moveCd interval ----------------------------
function tryMove(dt){
  // Freeze player when any UI overlay or battle owns input.
  if (settingsMenuOpen || zyrexMenuOpen || battleState){
    player.moving = false;
    return;
  }
  player.moveCd -= dt;
  if (player.moveCd > 0) return;

  let dx = 0, dy = 0, dir = player.dir;
  if (keys['arrowup']    || keys['w']) { dy = -1; dir = 'up';    }
  else if (keys['arrowdown']  || keys['s']) { dy =  1; dir = 'down';  }
  else if (keys['arrowleft']  || keys['a']) { dx = -1; dir = 'left';  }
  else if (keys['arrowright'] || keys['d']) { dx =  1; dir = 'right'; }

  if (!dx && !dy){ player.moving = false; return; }

  const nx = player.x + dx, ny = player.y + dy;
  player.dir = dir;
  if (!walkable(nx, ny)){ player.moveCd = 120; player.moving = false; return; }

  player.x = nx; player.y = ny;
  player.moving = true;
  player.animFrame = (player.animFrame + 1) % 4;

  // Sprint sources: hold Shift/B key · hold Circle button · OR L3-toggled lock.
  const running = !!keys['shift'] || !!keys['b'] || player.sprintLocked;
  player.running = running;
  player.moveCd = running ? 90 : 170;

  // Wild-Zyrex encounter · only fires when player has ≥1 Zyrex in party.
  // Grassblade / grass-patch tiles carry wildZone: true.  Stepping in
  // rolls the RP7 canon 14% chance after 2 consecutive grass steps.
  if (_wildZones.has(`${nx},${ny}`) && player.party.filter(z => z && z.hp > 0).length > 0){
    player.stepsInGrass = (player.stepsInGrass || 0) + 1;
    if (player.stepsInGrass >= 2 && Math.random() < 0.14){
      player.stepsInGrass = 0;
      startWildBattle();
    }
  } else {
    player.stepsInGrass = 0;
  }
}

// -- Renderer ----------------------------------------------------------------
function drawGrass(){
  // Cull to visible tile range so we only draw what's on screen.
  const startCol = Math.max(0, Math.floor(_cam.x / TILE));
  const endCol   = Math.min(MAP_COLS, Math.ceil((_cam.x + canvas.width)  / TILE));
  const startRow = Math.max(0, Math.floor(_cam.y / TILE));
  const endRow   = Math.min(MAP_ROWS, Math.ceil((_cam.y + canvas.height) / TILE));
  if (GRASS.complete && GRASS.naturalWidth){
    for (let ty = startRow; ty < endRow; ty++){
      for (let tx = startCol; tx < endCol; tx++){
        ctx.drawImage(GRASS,
          0, 0, GRASS.naturalWidth, GRASS.naturalHeight,
          tx * TILE - _cam.x, ty * TILE - _cam.y, TILE, TILE);
      }
    }
  } else {
    ctx.fillStyle = '#3a6b3a';
    ctx.fillRect(-_cam.x, -_cam.y, MAP_COLS * TILE, MAP_ROWS * TILE);
  }
}

// ★ Universal per-source-pixel scale · anchored to tallest bbox seen
// across ALL loaded rizer bundles.  This is the ONE knob for character
// size — every source pixel maps to the same dest pixel size regardless
// of which sheet or which cell.  Result: belt/hair/arms are identical
// pixel size across idle/walk/run, and pose-height variance (crouch vs
// full stride) renders naturally instead of being squished to a fixed
// on-screen height.  Recomputed each frame in case a bundle just loaded.
function currentCharScale(){
  let maxH = 1;
  for (const b of [RIZER.idle, RIZER.walk, RIZER.run]){
    if (!b.loaded || !b.bboxes) continue;
    for (const row of b.bboxes){
      for (const cell of row){
        if (cell[3] > maxH) maxH = cell[3];
      }
    }
  }
  return (2 * TILE) / maxH;
}

function drawPlayer(){
  // Pick the sheet based on state · fall back to whichever bundle is
  // actually loaded so we still see the character while sheets are
  // being re-delivered (e.g. only run is wired right now).
  const useRun  = player.running && player.moving && RIZER.run.loaded;
  const useWalk = player.moving && RIZER.walk.loaded;
  let bundle = useRun ? RIZER.run : useWalk ? RIZER.walk : (RIZER.idle.loaded ? RIZER.idle : null);
  if (!bundle){
    // Fall through in priority order: run > walk > idle
    if (RIZER.run.loaded)       bundle = RIZER.run;
    else if (RIZER.walk.loaded) bundle = RIZER.walk;
    else if (RIZER.idle.loaded) bundle = RIZER.idle;
  }

  // ★ PLACEHOLDER · sprites purged pending fresh delivery.  Draw a
  // 1x2-tile gold rectangle at the player's feet-anchored position so
  // world state is still visible during the reset.
  if (!bundle){
    const pw = TILE, ph = TILE * 2;
    const pdx = Math.floor(player.x * TILE + (TILE - pw) / 2) - _cam.x;
    const pdy = Math.floor(player.y * TILE + TILE - ph)       - _cam.y;
    ctx.fillStyle = '#d4af37';
    ctx.fillRect(pdx, pdy, pw, ph);
    ctx.strokeStyle = '#0b0b10';
    ctx.lineWidth = 2;
    ctx.strokeRect(pdx, pdy, pw, ph);
    // tiny direction pip on the "front"
    ctx.fillStyle = '#0b0b10';
    const cx = pdx + pw/2, cy = pdy + ph*0.35;
    if (player.dir === 'up')    ctx.fillRect(cx-3, pdy+4,   6, 4);
    if (player.dir === 'down')  ctx.fillRect(cx-3, pdy+ph-8, 6, 4);
    if (player.dir === 'left')  ctx.fillRect(pdx+4,    cy-3, 4, 6);
    if (player.dir === 'right') ctx.fillRect(pdx+pw-8, cy-3, 4, 6);
    return;
  }
  const src = bundle.img;
  if (!src || !src.complete) return;

  // All three sheets are 4x4 · row = direction · col = animation frame.
  const row = DIR_ROW[player.dir];
  const col = player.animFrame % bundle.cols;

  // Pull the character's actual pixel bbox (not the padded cell) so the
  // source rect is the CHARACTER, not the whitespace around it.
  const bboxes = bundle.bboxes;
  let bx = 0, by = 0, bw = bundle.cellW, bh = bundle.cellH;
  if (bboxes && bboxes[row] && bboxes[row][col]){
    [bx, by, bw, bh] = bboxes[row][col];
  }
  const sx = col * bundle.cellW + bx;
  const sy = row * bundle.cellH + by;

  // ★ CONSTANT head-to-feet extent · every cell renders at drawH = 2 tiles.
  // Width preserves the character's own bbox aspect ratio (not the cell's).
  // Result: character is exactly 2 tiles head-to-feet in every animation
  // state — no bounce, no cross-sheet size drift.  A hard cap on drawW
  // stops any freak-wide bbox (extended-arm running frames) from over-
  // spreading beyond ~1.5 tiles wide.
  // ★ CONSTANT drawH · character head-to-feet is EXACTLY 2 tiles in every
  // pose (2026-08-05).  The artist draws up-facing back-view with smaller
  // bbox than side/down profiles (idle: up=207 vs right=292 · a 40% delta);
  // per-pixel scaling made up-facing render short → read as "hair cropped."
  // Constant drawH keeps visible height identical.  Per-pixel body detail
  // varies between poses but that's the tradeoff for consistent on-screen
  // size, which is what the user cares about.
  const drawH = TILE * 2;
  const drawW = Math.max(1, Math.round(drawH * (bw / bh)));
  const dx = Math.floor(player.x * TILE + (TILE - drawW) / 2) - _cam.x;
  const dy = Math.floor(player.y * TILE + TILE - drawH)       - _cam.y;

  // Ground shadow at the CHARACTER'S actual feet · drawn just under
  // dy+drawH (bbox bottom = feet).  Gives a solid ground contact so
  // the sprite doesn't feel like it's floating.
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(
    dx + drawW / 2,
    dy + drawH - 2,
    Math.min(drawW / 2, TILE / 2 - 2),
    3, 0, 0, Math.PI * 2
  );
  ctx.fill();

  ctx.drawImage(src, sx, sy, bw, bh, dx, dy, drawW, drawH);
}

function tryInteract(){
  let fx = player.x, fy = player.y;
  if (player.dir === 'up')    fy--;
  if (player.dir === 'down')  fy++;
  if (player.dir === 'left')  fx--;
  if (player.dir === 'right') fx++;
  const doorProp = _propDoors.get(`${fx},${fy}`);
  if (doorProp && doorProp.onInteract){ doorProp.onInteract(); return; }
  showToast('◈ Grass.  All quiet.');
}
let _lastInteract = 0;

// Settings menu selection state (arrow-nav + confirm on Z/X)
let settingsSelectedIdx = 0;

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();

  // ═══════════════════════════════════════════════════════════════
  // 1) BATTLE INPUT · owns keys entirely while battleState !== null
  // ═══════════════════════════════════════════════════════════════
  if (battleState){
    if (battleState.menu === 'over'){
      // Any confirm exits back to overworld.
      if (k === 'z' || k === 'x' || k === 'enter' || k === ' ' || k === 'shift'){
        battleExit();
      }
      return;
    }
    if (battleState.menu === 'main'){
      // Menu: 0=FIGHT · 1=BAG · 2=SWAP · 3=RUN (grid 2x2)
      if (k === 'arrowup')    battleState.selectedMenuIdx = (battleState.selectedMenuIdx + 2) % 4;
      if (k === 'arrowdown')  battleState.selectedMenuIdx = (battleState.selectedMenuIdx + 2) % 4;
      if (k === 'arrowleft')  battleState.selectedMenuIdx = (battleState.selectedMenuIdx ^ 1);
      if (k === 'arrowright') battleState.selectedMenuIdx = (battleState.selectedMenuIdx ^ 1);
      if (k === 'z' || k === 'x' || k === 'enter'){
        const opt = battleState.selectedMenuIdx;
        if (opt === 0){ battleState.menu = 'fight'; battleState.selectedMoveIdx = 0; }
        else if (opt === 1){ battleAppendLog('Bag not wired yet.'); }
        else if (opt === 2){ battleAppendLog('Swap not wired yet.'); }
        else if (opt === 3){ battleRun(); }
      }
      return;
    }
    if (battleState.menu === 'fight'){
      const moves = battleState.player.moves;
      if (k === 'arrowup')    battleState.selectedMoveIdx = (battleState.selectedMoveIdx + moves.length - 1) % moves.length;
      if (k === 'arrowdown')  battleState.selectedMoveIdx = (battleState.selectedMoveIdx + 1) % moves.length;
      if (k === 'shift'){ battleState.menu = 'main'; return; }   // Circle = back
      if (k === 'z' || k === 'x' || k === 'enter'){
        const move = moves[battleState.selectedMoveIdx];
        battleExecuteMove(move);
        if (!battleState.over) battleState.menu = 'main';
      }
      return;
    }
  }

  // ═══════════════════════════════════════════════════════════════
  // 2) SETTINGS MENU · owns keys entirely while open
  // ═══════════════════════════════════════════════════════════════
  if (settingsMenuOpen){
    if (settingsPage === 'root'){
      if (k === 'arrowup')   settingsSelectedIdx = (settingsSelectedIdx + SETTINGS_ITEMS.length - 1) % SETTINGS_ITEMS.length;
      if (k === 'arrowdown') settingsSelectedIdx = (settingsSelectedIdx + 1) % SETTINGS_ITEMS.length;
      if (k === 'z' || k === 'x' || k === 'enter'){
        // Enter selected sub-page
        settingsPage = SETTINGS_PAGE_IDS[settingsSelectedIdx];
      }
      // Circle OR Options both CLOSE from root.
      if (k === 'shift' || k === '3'){
        settingsMenuOpen = false;
        settingsSelectedIdx = 0;
        settingsPage = 'root';
      }
    } else {
      // Sub-page: Circle backs to root.  Options CLOSES entirely.
      if (k === 'shift'){
        settingsPage = 'root';
      } else if (k === '3'){
        settingsMenuOpen = false;
        settingsSelectedIdx = 0;
        settingsPage = 'root';
      }
    }
    return;
  }

  // ═══════════════════════════════════════════════════════════════
  // 3) ZYREX MENU · read-only inspect for now · Touchpad/2 closes
  // ═══════════════════════════════════════════════════════════════
  if (zyrexMenuOpen){
    if (k === '2' || k === 'shift') zyrexMenuOpen = false;
    if (k === '9') giveDevElzebub();
    return;
  }

  // ═══════════════════════════════════════════════════════════════
  // 4) OVERWORLD KEYS
  // ═══════════════════════════════════════════════════════════════
  if (k === 'z' || k === 'x' || k === 'enter' || k === ' '){
    const now = performance.now();
    if (now - _lastInteract > 220){ tryInteract(); _lastInteract = now; }
  }
  if (k === '2'){ zyrexMenuOpen    = !zyrexMenuOpen; }
  if (k === '3'){ settingsMenuOpen = !settingsMenuOpen; }
  if (k === '9'){ giveDevElzebub(); }
});

    type2: 'Elemental',

// + aov-district-type-pool).  Elzebub is our dev-test T1 · expand as user
// confirms more canonical T1s.
const MALEZOR_WILD_POOL = ['elzebub'];

// XP · Fast growth curve (T1 species) per aov-zyrex-growth-curves.
// Total XP required at level N = floor(0.8 * N^3).  xpToNextLevel returns
// the delta from current level to next.
function xpToNextLevel(lv){
  const cur  = Math.floor(0.8 * Math.pow(lv,     3));
  const next = Math.floor(0.8 * Math.pow(lv + 1, 3));
  return next - cur;
}

function createZyrex(speciesId, level){
  const sp = SPECIES[speciesId];
  if (!sp) return null;
  // Level scaling: +5% per level above 1 (simple starter formula · real
  // build_codex growth curves land with the full battle system).
  const s = 1 + (level - 1) * 0.05;
  return {
    speciesId,
    name: sp.name,
    tier: sp.tier,
    type: sp.type, type2: sp.type2,
    level,
    xp: 0,
    hp:   Math.floor(sp.baseHP   * s),
    maxHp: Math.floor(sp.baseHP  * s),
    atk:  Math.floor(sp.baseATK  * s),
    def:  Math.floor(sp.baseDEF  * s),
    spd:  Math.floor(sp.baseSPD  * s),
    satk: Math.floor(sp.baseSATK * s),
    sdef: Math.floor(sp.baseSDEF * s),
    moves: sp.moves.slice(0, 4),
  };
}

function giveDevElzebub(){

// battleState is null when in overworld · object during battle.
//   { player, wild, log[], menu:'main'|'fight'|'over', turnPending:'player'|'wild'|null }
let battleState = null;

function startWildBattle(){
  const active = player.party[0];
  if (!active || active.hp <= 0) return;   // no live Zyrex to fight with
  const speciesId = MALEZOR_WILD_POOL[Math.floor(Math.random() * MALEZOR_WILD_POOL.length)];
  const wildLv = 1 + Math.floor(Math.random() * 5);   // 1..5 per user
  const wild = createZyrex(speciesId, wildLv);
  battleState = {
    player: active,
    wild,
    log: [`A wild ${wild.name} appeared! (Lv ${wildLv})`],
    menu: 'main',       // 'main' | 'fight' | 'over'
    over: false,        // true when either fainted
    selectedMenuIdx: 0,
    selectedMoveIdx: 0,
  };
}

// Damage: max(1, floor((atk - def/2) * power / 20))
function calcDamage(attacker, defender, moveName){
  const mv = MOVES[moveName]; if (!mv || mv.power === 0) return 0;
  const raw = (attacker.atk - defender.def / 2) * mv.power / 20;
  return Math.max(1, Math.floor(raw));
}

function battleAppendLog(msg){
  battleState.log.push(msg);
  if (battleState.log.length > 4) battleState.log = battleState.log.slice(-4);
}

// Execute one full round · attacker moves first, defender counters if alive.
function battleExecuteMove(playerMoveName){
  const p = battleState.player, w = battleState.wild;
  // Random wild move
  const wildMove = w.moves[Math.floor(Math.random() * w.moves.length)];
  // Speed order · higher SPD goes first
  const playerFirst = p.spd >= w.spd;
  const acts = playerFirst
    ? [['player', playerMoveName], ['wild', wildMove]]
    : [['wild', wildMove], ['player', playerMoveName]];
  for (const [who, mv] of acts){
    if (p.hp <= 0 || w.hp <= 0) break;
    const atk  = who === 'player' ? p : w;
    const def  = who === 'player' ? w : p;
    const dmg  = calcDamage(atk, def, mv);
    def.hp = Math.max(0, def.hp - dmg);
    battleAppendLog(`${atk.name} used ${mv}!` + (dmg > 0 ? ` (${dmg} dmg)` : ' (no effect)'));
  }
  // Resolve
  if (w.hp <= 0){
    // Award XP · enemyLv × (8 + tier×8) × 1.0 × 0.80 (wild fight)
    const gained = Math.floor(w.level * (8 + p.tier * 8) * 0.80);
    p.xp += gained;
    battleAppendLog(`Wild ${w.name} fainted!  +${gained} XP`);
    // Level ups
    while (p.xp >= xpToNextLevel(p.level)){
      p.xp -= xpToNextLevel(p.level);
      p.level += 1;
      // Recompute stats · scale to new level
      const sp = SPECIES[p.speciesId];
      const s = 1 + (p.level - 1) * 0.05;
      const oldMax = p.maxHp;
      p.maxHp = Math.floor(sp.baseHP * s);
      p.hp   += (p.maxHp - oldMax);      // heal by the diff
      p.atk   = Math.floor(sp.baseATK  * s);
      p.def   = Math.floor(sp.baseDEF  * s);
      p.spd   = Math.floor(sp.baseSPD  * s);
      p.satk  = Math.floor(sp.baseSATK * s);
      p.sdef  = Math.floor(sp.baseSDEF * s);
      battleAppendLog(`${p.name} leveled up to Lv ${p.level}!`);
    }
    battleState.over = true;
    battleState.menu = 'over';
  } else if (p.hp <= 0){
    battleAppendLog(`${p.name} fainted!  You blacked out.`);
    battleState.over = true;
    battleState.menu = 'over';
  }
}

function battleRun(){
  if (Math.random() < 0.5){
    battleAppendLog('Got away safely.');
    battleState.over = true;
    battleState.menu = 'over';
  } else {
    battleAppendLog(`Couldn't escape!`);
    // Wild gets a free hit
    const wildMove = battleState.wild.moves[Math.floor(Math.random() * battleState.wild.moves.length)];
    const dmg = calcDamage(battleState.wild, battleState.player, wildMove);
    battleState.player.hp = Math.max(0, battleState.player.hp - dmg);
    battleAppendLog(`Wild ${battleState.wild.name} used ${wildMove}! (${dmg} dmg)`);
    if (battleState.player.hp <= 0){
      battleAppendLog(`${battleState.player.name} fainted!  You blacked out.`);
      battleState.over = true;
      battleState.menu = 'over';
    }
  }
}

function battleExit(){
  const p = battleState && battleState.player;
  // If we blacked out, restore player-side to 1 HP so we're not stuck-dead.
  if (p && p.hp <= 0) p.hp = 1;
  battleState = null;
}

// -- Settings menu overlay (same style as Zyrex menu) ------------------------
// Options button ('3') toggles.  4 items: Items · Gear · Save State · Options.
// Circle (Shift) backs out of a sub-page · closes menu from the root.
let settingsMenuOpen = false;
let settingsPage = 'root';    // 'root' | 'items' | 'gear' | 'save' | 'options'
const SETTINGS_ITEMS = [
  '1. ITEMS',
  '2. GEAR',
  '3. SAVE STATE',
  '4. OPTIONS',
];
const SETTINGS_PAGE_IDS = ['items', 'gear', 'save', 'options'];
function drawSettingsMenu(){
  if (!settingsMenuOpen) return;
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.86)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#d4af37';
  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.textAlign = 'left';

                settingsPage === 'items' ? 'SETTINGS · ITEMS' :
                settingsPage === 'gear'  ? 'SETTINGS · GEAR' :
                settingsPage === 'save'  ? 'SETTINGS · SAVE STATE' :

  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(24, 50); ctx.lineTo(W - 24, 50); ctx.stroke();

  if (settingsPage === 'root'){
    ctx.font = 'bold 16px "Courier New", monospace';
    SETTINGS_ITEMS.forEach((label, i) => {
      const selected = (i === settingsSelectedIdx);
      if (selected){
        ctx.fillStyle = '#d4af37';
        ctx.fillRect(24, 82 + i * 40, W - 48, 30);
        ctx.fillStyle = '#0b0b10';
      } else {
        ctx.fillStyle = '#f0eadf';
      }
      ctx.fillText(`${selected ? '▶ ' : '  '}${label}`, 32, 103 + i * 40);
    });
    ctx.fillStyle = '#8ff';
    ctx.font = '11px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.fillText('▲▼ nav · × select · ○/Options close', W - 24, H - 20);
    ctx.textAlign = 'left';
  } else if (settingsPage === 'items'){
    const entries = sortedInventoryEntries();
    ctx.font = '14px "Courier New", monospace';
    if (entries.length === 0){
      ctx.fillStyle = '#aaa';
      ctx.fillText('· No items yet ·', 32, 90);
      ctx.fillStyle = '#8ff';
      ctx.font = '11px "Courier New", monospace';
      ctx.fillText('open chests or talk to NPCs to collect items', 32, 115);
    } else {
      ctx.fillStyle = '#f0eadf';
      entries.forEach(([key, n], i) => {
        const meta = INVENTORY_META[key];
        const label = (meta && meta.label) || key;
        ctx.fillText(`${label.padEnd(24, ' ')} x ${n}`, 32, 90 + i * 22);
      });

    ctx.fillStyle = '#8ff';
    ctx.font = '11px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.fillText('○ back · ○/Options close', W - 24, H - 20);
    ctx.textAlign = 'left';
  } else {
    // Gear / Save / Options placeholder
    ctx.fillStyle = '#aaa';
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText('· page not wired yet ·', 32, 90);
    ctx.fillStyle = '#8ff';
    ctx.font = '11px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.fillText('○ back · ○/Options close', W - 24, H - 20);
    ctx.textAlign = 'left';
  }
}

// -- Battle overlay ---------------------------------------------------------
// Full-screen turn-based battle UI · owns input while battleState !== null.
function drawBattleOverlay(){
  if (!battleState) return;
  const W = canvas.width, H = canvas.height;
  const p = battleState.player, w = battleState.wild;

  // Background · dark gradient-ish
  ctx.fillStyle = '#0b0b10';
  ctx.fillRect(0, 0, W, H);

  // Wild card · top
  drawBattleCard(w, 20, 40, 'WILD', true);
  // Player card · bottom
  drawBattleCard(p, W - 20 - 220, H - 220, 'YOUR', false);

  // Battle log · center-top
  ctx.fillStyle = '#f0eadf';
  ctx.font = '11px "Courier New", monospace';
  ctx.textAlign = 'left';
  const logY = H - 380;
  battleState.log.forEach((line, i) => {
    ctx.fillText(line, 20, logY + i * 16);
  });

  // Menu
  if (battleState.menu === 'main'){
    const items = ['FIGHT', 'BAG', 'SWAP', 'RUN'];
    const bx = 20, by = H - 100, cw = 130, ch = 34, gap = 6;
    items.forEach((label, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const x = bx + col * (cw + gap);
      const y = by + row * (ch + gap);
      const sel = (i === battleState.selectedMenuIdx);
      ctx.fillStyle = sel ? '#d4af37' : 'rgba(0,0,0,0.6)';
      ctx.fillRect(x, y, cw, ch);
      ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 1;
      ctx.strokeRect(x, y, cw, ch);
      ctx.fillStyle = sel ? '#0b0b10' : '#f0eadf';
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.fillText(label, x + 16, y + 22);
    });
  } else if (battleState.menu === 'fight'){
    const moves = p.moves;
    const bx = 20, by = H - 100, cw = 130, ch = 34, gap = 6;
    moves.forEach((mname, i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const x = bx + col * (cw + gap);
      const y = by + row * (ch + gap);
      const sel = (i === battleState.selectedMoveIdx);
      const mv = MOVES[mname];
      ctx.fillStyle = sel ? '#d4af37' : 'rgba(0,0,0,0.6)';
      ctx.fillRect(x, y, cw, ch);
      ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 1;
      ctx.strokeRect(x, y, cw, ch);
      ctx.fillStyle = sel ? '#0b0b10' : '#f0eadf';
      ctx.font = 'bold 12px "Courier New", monospace';
      ctx.fillText(mname, x + 8, y + 16);
      ctx.font = '10px "Courier New", monospace';
      ctx.fillText(`${mv ? mv.type : '?'} · pow ${mv ? mv.power : 0}`, x + 8, y + 30);
    });
    ctx.fillStyle = '#8ff';
    ctx.font = '11px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.fillText('○ back', W - 20, H - 20);
    ctx.textAlign = 'left';
  } else if (battleState.menu === 'over'){
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, H - 60, W, 60);
    ctx.fillStyle = '#d4af37';
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('press × to continue', W / 2, H - 28);
    ctx.textAlign = 'left';
  }
}

function drawBattleCard(z, x, y, label, isTop){
  const cw = 220, ch = 90;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(x, y, cw, ch);
  ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2;
  ctx.strokeRect(x, y, cw, ch);
  ctx.fillStyle = '#d4af37';
  ctx.font = '10px "Courier New", monospace';
  ctx.textAlign = 'left';
  ctx.fillText(label, x + 8, y + 14);
  ctx.fillStyle = '#f0eadf';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText(`${z.name.toUpperCase()}  Lv ${z.level}  T${z.tier}`, x + 8, y + 32);
  ctx.font = '10px "Courier New", monospace';
  ctx.fillStyle = '#aaa';
  ctx.fillText(`${z.type}${z.type2 ? ' / ' + z.type2 : ''}`, x + 8, y + 46);
  // HP bar
  const barX = x + 8, barY = y + 54, barW = cw - 16, barH = 10;
  ctx.strokeStyle = '#666'; ctx.strokeRect(barX, barY, barW, barH);
  const frac = z.hp / z.maxHp;
  ctx.fillStyle = frac > 0.5 ? '#5f5' : frac > 0.2 ? '#fd5' : '#f55';
  ctx.fillRect(barX + 1, barY + 1, (barW - 2) * frac, barH - 2);
  ctx.fillStyle = '#f0eadf';
  // Line: 'HP curHP/maxHP   atk def spd satk sdef' (numbers only, no labels
  // per user 2026-08-05).  HP label kept because user asked for it.
  ctx.fillText(`HP ${z.hp}/${z.maxHp}   ${z.atk} ${z.def} ${z.spd} ${z.satk} ${z.sdef}`, x + 8, y + 80);
}

// -- Zyrex party menu overlay ------------------------------------------------

    player.party.forEach((z, i) => {

      ctx.fillText(`HP ${z.hp}/${z.maxHp}   ATK ${z.atk}  DEF ${z.def}  SPD ${z.spd}`, barX, barY + barH + 12);
    });
  }
  ctx.fillStyle = '#8ff';
  ctx.font = '11px "Courier New", monospace';
  ctx.textAlign = 'right';
  ctx.fillText('Touchpad / 2 · close', W - 24, H - 20);
  ctx.textAlign = 'left';
}

// -- Props renderer · depth-sorted with player ------------------------------
// Feet-Y anchor: props draw with their bottom edge on tileY.  Player is at
// tile (px, py) with feet on the bottom of the tile.  Renderables with
// smaller feet-Y draw first (further from camera).
function drawWorldLayer(){
  const renderables = [];
  WORLD_PROPS.forEach(p => {
    if (!p.img.complete || !p.img.naturalWidth) return;
    renderables.push({ kind:'prop', prop:p, footY: p.tileY });
  });
  renderables.push({ kind:'player', footY: player.y });
  renderables.sort((a,b) => a.footY - b.footY);
  for (const r of renderables){
    if (r.kind === 'prop') drawProp(r.prop);
    else                   drawPlayer();
  }
}

function drawProp(p){
  const [bx, by, bw, bh] = p.bbox;
  const drawW = p.tileW * TILE;
  const drawH = Math.round(drawW * (bh / bw));   // preserve source aspect
  // Anchor: bottom-center of prop sits on bottom edge of tile (tileX, tileY)
  const dx = Math.floor((p.tileX + 0.5) * TILE - drawW / 2) - _cam.x;
  const dy = Math.floor((p.tileY + 1)   * TILE - drawH)     - _cam.y;
  // Cull: skip props whose whole footprint is off-screen
  if (dx + drawW < 0 || dx > canvas.width)  return;
  if (dy + drawH < 0 || dy > canvas.height) return;
  ctx.drawImage(p.img, bx, by, bw, bh, dx, dy, drawW, drawH);
}

// -- Loop --------------------------------------------------------------------
let last = performance.now();
function frame(now){
  const dt = now - last; last = now;
  tryMove(dt);
  // No idle animation · lock to frame 0 of the current direction when
  // not moving.  Walking/running frame advance still lives in tryMove.
  if (!player.moving) player.animFrame = 0;
  updateCamera();
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawGrass();
  drawWorldLayer();     // props + player, depth-sorted by feet-Y
  drawZyrexMenu();      // overlay · touchpad ('2') toggles
  drawSettingsMenu();   // overlay · Options ('3') toggles
  drawBattleOverlay();  // owns whole screen while battleState is set
  requestAnimationFrame(frame);
}
requestAnimationFrame(now => { last = now; frame(now); });

console.log('[rp7b] skeleton v0.7 ready · map', MAP_COLS + 'x' + MAP_ROWS, '· TILE', TILE, '· props', WORLD_PROPS.length);
